<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Ledgers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<!--
  The Ledger app.

  This page is served from an ordinary web address, NOT from Google. That is
  deliberate and it is the whole point of this file.

  Apps Script serves its own pages through Google Drive, and on a device signed
  into several Google accounts Google routes that request to a per-account
  address that does not exist for web apps — Drive then answers "Sorry, unable
  to open the file at present". Measured across three attempts: no account
  works, one account works, several accounts fail, including inside a Google
  Sites embed, because an embed is still a navigation.

  Here the browser never navigates to Google. It loads this page from a neutral
  host and asks the script for figures in the background. Background requests
  carry no Google session, so there is no account to route by and the fault
  cannot happen. Proven from example.com before this file was written.
-->
<style>
  :root {
    --bg: #f6f7f9;  --card: #ffffff;  --ink: #16181d;  --muted: #6b7280;
    --line: #e5e7eb; --dr: #b3261e;   --cr: #12603c;   --accent: #1a56db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #191c22; --ink: #e8eaed; --muted: #9aa1ad;
      --line: #2a2e37; --dr: #ff8a80; --cr: #6ddba0;  --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 10px; font-size: 19px; letter-spacing: -0.01em; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  button.link { background: none; border: 0; color: var(--accent); font-size: 15px;
                padding: 0 0 8px; cursor: pointer; }
  input { width: 100%; padding: 12px 13px; font-size: 16px; color: var(--ink);
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  /* A flex or grid rule beats the hidden attribute, so the date row and the
     period chips stayed on screen after being hidden. This settles it once for
     every element rather than per rule. */
  [hidden] { display: none !important; }
  select { width: 100%; padding: 12px 13px; font-size: 16px; color: var(--ink);
           background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  main { padding: 10px 12px 32px; }

  /* the order form */
  .field { margin-top: 10px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-top: 10px;
  }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; }
  .card .head b { font-size: 13px; }
  .tick { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 10px; }
  .tick input { width: auto; }
  .primary {
    display: block; width: 100%; margin-top: 14px; padding: 13px;
    font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--accent); border: 0; border-radius: 10px;
  }
  .primary[disabled] { opacity: .6; }
  .total { display: flex; justify-content: space-between; margin-top: 14px;
           font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .msg {
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.5; margin-top: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px;
  }

  .signin { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }
  .signin h2 { margin: 0 0 4px; font-size: 22px; }
  .signin p.note { margin: 0 0 22px; }
  .signin input { margin-bottom: 10px; }
  .signin button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px;
  }
  .signin button[disabled] { opacity: .6; }
  .error { color: var(--dr); margin: 12px 0 0; font-size: 14px; }

  .row {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .row:active { opacity: .6; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  /*
    Dr is the ordinary case — most parties owe us — so it takes the normal text
    colour rather than a warning colour: white on the dark theme, near-black on
    the light one. Literal white would vanish against a light background.
    Red is kept for the two places that mean something is wrong: a failed sign
    in, and a loss on the Profit screen.
  */
  .dr { color: var(--ink); } .cr { color: var(--cr); }
  .loss { color: var(--dr); }
  .tag { font-size: 11px; color: var(--muted); font-weight: 500; }
  .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between;
  }
  .summary .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 6px; text-align: right; font-variant-numeric: tabular-nums;
           border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px;
       text-transform: uppercase; letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .note { color: var(--muted); font-size: 12px; }
  .more {
    display: block; width: 100%; margin-top: 14px; padding: 12px;
    font-size: 15px; color: var(--accent); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  /* Small and quiet, in the balance panel. It is a thing you reach for now and
     then, not the point of the screen — so it sits in WhatsApp's green only as
     a thin outline, enough to say what it does without shouting it. */
  .share {
    margin-top: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600;
    color: #128c4a; background: transparent; cursor: pointer;
    border: 1px solid #25d366; border-radius: 999px; line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) { .share { color: #6ddba0; } }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }

  /* What a figure used to be, in the Edits list. Struck through rather than
     merely greyed: grey alone reads as "less important", and this is not less
     important, it is no longer true. */
  .was { color: var(--muted); text-decoration: line-through; }
  /* A statement line offers to be corrected, so it has to look touchable. */
  tr.entry { cursor: pointer; }
  tr.entry:active { background: var(--line); }

  .chips { margin-top: 10px; }
  /* The period picker. Full width on purpose: it is the one control that says
     what every figure on the screen covers, so it should not look incidental. */
  .pick {
    width: 100%; padding: 9px 12px; font-size: 14px; cursor: pointer;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .range { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .range input { padding: 8px 10px; font-size: 14px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab {
    /* Five tabs across a phone. min-width:0 is what lets them share the width
       evenly — without it a flex item will not shrink below its text, so the
       last tab is pushed off the right edge and cannot be tapped at all. */
    flex: 1; min-width: 0; white-space: nowrap;
    padding: 9px 2px; font-size: 13px; cursor: pointer;
    color: var(--muted); background: none; border: 0;
    border-bottom: 2px solid var(--line);
  }
  .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  /* Six tabs on a 360px phone leave about 51px each, and "Expenses" at 13px
     does not fit in that. Smaller type and a tighter gap keep every label whole
     on one row instead of spilling into its neighbour. */
  @media (max-width: 420px) {
    .tabs { gap: 2px; }
    .tab { font-size: 11.5px; padding: 9px 0; text-overflow: ellipsis; overflow: hidden; }
  }

  .pl { background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 4px 14px 10px; margin-bottom: 12px; }
  .pl .l { display: flex; justify-content: space-between; padding: 9px 0;
           border-bottom: 1px solid var(--line); }
  .pl .l:last-child { border-bottom: 0; }
  .pl .head { font-weight: 600; font-size: 12px; text-transform: uppercase;
              letter-spacing: .04em; color: var(--muted); padding-top: 14px; }
  .pl .v { font-variant-numeric: tabular-nums; }
  .pl .tot { font-weight: 600; }
  .pl .net { font-size: 19px; font-weight: 700; }
  .pl .sub { padding-left: 12px; }
</style>
</head>
<body>

<div id="signin" class="signin">
  <p class="note" id="signinNote">Sign in to continue.</p>
  <input id="u" type="text" placeholder="Username" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <p class="error" id="err" hidden></p>
</div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <button class="link" id="back" hidden>‹ All parties</button>
      <!-- Which build is actually loaded. A phone can serve a cached copy for
           hours, and without this there is no way to tell that apart from a
           fault in the code — which cost an afternoon once. -->
      <span class="note" id="build" style="cursor:pointer">build 34</span>
      <button class="link" id="out">Sign out</button>
    </div>
    <h1 id="title">Ledgers</h1>
    <div class="tabs">
      <button class="tab on" id="tabLedgers">Ledgers</button>
      <button class="tab" id="tabExpenses">Expenses</button>
      <button class="tab" id="tabOrders">Orders</button>
      <button class="tab" id="tabMoney">Money</button>
      <button class="tab" id="tabRecent">Recent</button>
      <button class="tab" id="tabPL">Profit</button>
    </div>
    <input type="search" id="search" placeholder="Search a party" autocomplete="off">
    <div class="chips" id="periods"></div>
    <div class="range" id="range" hidden>
      <input type="date" id="from"><span class="note" id="rangeTo">to</span><input type="date" id="to">
      <button class="link" id="apply">Apply</button>
    </div>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

  var LANG = 'en';

    'Wrong username or password.': '\u0ab5\u0aaa\u0ab0\u0abe\u0ab6\u0a95\u0ab0\u0acd\u0aa4\u0abe \u0aa8\u0abe\u0aae \u0a95\u0ac7 \u0aaa\u0abe\u0ab8\u0ab5\u0ab0\u0acd\u0aa1 \u0a96\u0acb\u0a9f\u0acb \u0a9b\u0ac7.',
    // The key must be the server's words exactly, or the lookup misses and the
    // English shows. The server builds this from screenName_('pnl'), which is
    // the ACCESS_SCREENS heading \u2014 'P&L'. This row said 'Profit & Loss is not
    // part of this login.' and so had never once matched; found 16 Oct 2026.

    'The request could not be read.': '\u0ab5\u0abf\u0aa8\u0a82\u0aa4\u0ac0 \u0ab5\u0abe\u0a82\u0a9a\u0ac0 \u0ab6\u0a95\u0abe\u0a88 \u0aa8\u0ab9\u0ac0\u0a82.'
  };

  /** Keep this device's idea of the language in step with the server's. */
  function rememberLang() {
    try { localStorage.setItem('ledger_lang', LANG); } catch (e) {}
  }

  /**
   * What the sheet says instead, for the phrases somebody has filled in.
   *
   * Checked before the built-in table, so the App Words tab always wins. An
   * empty cell never reaches here, which is what makes a half-finished tab
   * safe: the app falls back to its own wording phrase by phrase.
   */
  var WORDS = {};

  /**
   * Tell the sheet every phrase this build can print, and take back the ones
   * somebody has translated.
   *
   * The app is the only thing that knows what it says, so it sends the list
   * rather than the list being kept twice. Failure is silent on purpose: the
   * app already has working wording, and a screen should not break because a
   * dictionary could not be reached.
   */
  function loadWords() {
    // What it can say AND what it currently says, so the tab opens showing the
    // wording in use rather than a column of blanks to retype.
    return api('words', {
      token: TOKEN,
      keys: Object.keys(GU),
      pairs: Object.keys(GU).map(function (k) { return [k, GU[k]]; })
    })
      .then(function (r) {
        if (r && r.data && r.data.words) WORDS = r.data.words;
        localizeStatic();
      })
      .catch(function () {});
  }

  /** English in, the login's language out. An unknown string stays as it is. */
  function t(s) {
    if (LANG !== 'gu') return s;
    return WORDS[s] || GU[s] || s;
  }

  /**
   * "Posted since 18 Sep" in English is "18 Sep થી નોંધાયેલું" in Gujarati —
   * the date leads and the phrase follows. Word order is not something a
   * lookup table can carry, so the two orders are written out here rather than
   * left to a concatenation that is only right in one language.
   */
  function sinceLine(english, from) {
    return LANG === 'gu' ? esc(from) + ' ' + t(english)
                         : t(english) + ' ' + esc(from);
  }

  /**
   * The words written straight into the page, which no render function touches.
   * Run once the language is known; running it again is harmless.
   */
  function localizeStatic() {
    [['signinNote', 'Sign in to continue.'],
     ['go', 'Sign in'], ['out', 'Sign out'], ['back', backLabel()],
     ['tabLedgers', 'Ledgers'], ['tabExpenses', 'Expenses'],
     ['tabOrders', 'Orders'], ['tabMoney', 'Money'],
     ['tabRecent', 'Recent'], ['tabPL', 'Profit'],
     ['rangeTo', 'to'], ['apply', 'Apply']
    ].forEach(function (pair) {
      var el = $(pair[0]);
      if (el) el.textContent = t(pair[1]);
    });
    [['u', 'Username'], ['p', 'Password'], ['search', searchPrompt()]]
      .forEach(function (pair) {
        var el = $(pair[0]);
        if (el) el.placeholder = t(pair[1]);
      });
    if ($('title') && (VIEW === 'ledgers' || VIEW === 'expenses') && !current) {
      $('title').textContent = t(listTitle());
    }
  }

  var lastLedger = null;   // what the ledger screen is showing, so Share sends that and not something else
  var PERIOD = { from: '', to: '', label: '' };
  var $ = function (id) { return document.getElementById(id); };

  try { TOKEN = localStorage.getItem('ledger_token'); } catch (e) {}

  /**
   * The language of the LAST person to sign in on this device.
   *
   * The account decides the language, and the app does not know the account
   * until the sign-in is answered — so the sign-in screen itself can only be
   * English the first time. Remembering it here makes it Gujarati from the
   * second time on, for somebody who only ever signs in as themselves.
   *
   * It is a convenience, not a permission: the server sends the real answer
   * moments later and it is overwritten. Reading it can throw in a private
   * window, so it is wrapped like every other storage call here.
   */
  try {
    var remembered = localStorage.getItem('ledger_lang');
    if (remembered === 'gu' || remembered === 'en') LANG = remembered;
  } catch (e) {}

  /**
   * Every request to the script goes through here.
   *
   * POST with a text/plain content type on purpose: it counts as a "simple"
   * request, so the browser sends it straight out instead of asking permission
   * first with an OPTIONS call, which Apps Script cannot answer. It also keeps
   * the password and the token out of the web address, where they would end up
   * in browser history and server logs.
   */
  function api(action, params) {
    var body = Object.assign({ action: action }, params || {});
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('The server answered ' + r.status + '.');
      return r.json();
    }).then(function (j) {
      if (j.ok) return j;
      var err = new Error(j.error || 'Something went wrong.');
      err.expired = !!j.expired;
      throw err;
    });
  }

  function money(n) {
    return Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function side(n) { return n >= 0 ? 'Dr' : 'Cr'; }   // + party owes us, - we owe them
  function cls(n)  { return n >= 0 ? 'dr' : 'cr'; }
  function esc(s)  { return String(s == null ? '' : s).replace(/[&<>"]/g,
                      function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  // --- sign in --------------------------------------------------------------

  function signIn() {
    $('go').disabled = true; $('go').textContent = t('Signing in…'); $('err').hidden = true;

    api('login', { username: $('u').value, password: $('p').value })
      .then(function (r) {
        TOKEN = r.token;
        LANG = r.lang === 'gu' ? 'gu' : 'en';
        rememberLang();
        localizeStatic();
        try { localStorage.setItem('ledger_token', TOKEN); } catch (e) {}
        $('p').value = '';
        $('go').disabled = false; $('go').textContent = t('Sign in');
        // Sign-in brings the first screenful back with it. Absent (an older
        // server, or the prefetch threw), start() asks for it itself.
        start(r.boot || null);
      })
      .catch(function (e) {
        $('go').disabled = false; $('go').textContent = t('Sign in');
        $('err').textContent = t(e.message); $('err').hidden = false;
      });
  }

  function signOut(why) {
    api('logout', { token: TOKEN }).catch(function () {});
    TOKEN = null;
    try { localStorage.removeItem('ledger_token'); } catch (e) {}
    $('app').hidden = true; $('signin').hidden = false;
    if (typeof why === 'string' && why) {
      $('err').textContent = why; $('err').hidden = false;
    }
  }

  // --- ten quiet minutes and the session ends --------------------------------

  /**
   * The phone lives in a pocket, gets handed to a driver, gets left on a
   * counter. So an idle session ends — and it ends ON THE SERVER, by calling
   * logout, not merely by showing the sign-in box again. A token that is still
   * good is still good to whoever has it.
   *
   * The clock is checked on a timer rather than trusted to run down, because a
   * phone suspends background tabs: a page asleep for an hour would otherwise
   * wake believing no time had passed.
   */
  // The default. The App Settings tab can change it, and the server sends the
  // number with the rest of what this login gets — so it is a var, not a const.
  var IDLE_MINUTES = 10;
  var idleSince = Date.now(), idleTimer = null;

  function stillHere() {
    idleSince = Date.now();
    if (!idleTimer) idleTimer = setInterval(checkIdle, 15000);
  }

  function checkIdle() {
    if (!TOKEN) return;
    if (Date.now() - idleSince < IDLE_MINUTES * 60000) return;
    signOut('Signed out after ' + IDLE_MINUTES + ' minutes without use.');
  }

  ['touchstart', 'mousedown', 'keydown', 'scroll'].forEach(function (ev) {
    document.addEventListener(ev, stillHere, { passive: true });
  });

  // Coming back to a page that was in the background is the case the timer
  // alone cannot catch, so it is checked before the clock is reset.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    checkIdle();
    if (TOKEN) stillHere();
  });

  /** Any dead token lands here, from any screen, and returns to the login box. */
  function fail(e) {
    if (e.expired) {
      TOKEN = null;
      try { localStorage.removeItem('ledger_token'); } catch (e2) {}
      $('app').hidden = true; $('signin').hidden = false;
      $('err').textContent = t(e.message); $('err').hidden = false;
      return;
    }
    $('main').innerHTML = '<div class="empty">' + t('Could not load.') + '<br>' +
      '<span class="note">' + esc(t(e.message)) + '</span></div>';
  }

  // --- the period on screen -------------------------------------------------

  /**
   * What this login may see. The server says so on every start, so it is right
   * again after a reload, when the token comes back from storage and there is
   * no sign-in to answer.
   *
   * Hiding the tab is a courtesy, not the lock: the pnl action refuses on the
   * server whatever the phone shows.
   */
  var CAN_PL = true;

  /** Which screens this login may open, keyed as the App Access tab keys them. */
  var TABS = { ledgers: true, expenses: true, orders: true, recent: true, pnl: true, money: true };

  function showRights(fy) {
    // The language travels with the rights because both answer the same
    // question — what this login sees — and both must survive a reload,
    // where there is no sign-in to answer.
    LANG = fy.lang === 'gu' ? 'gu' : 'en';
    rememberLang();
    localizeStatic();

    // An older script answers without `tabs`. Everything stays visible then,
    // which is the same rule the sheet uses for a user with no row: a missing
    // answer must not remove screens somebody was using yesterday.
    if (fy.tabs) TABS = fy.tabs;
    if (fy.idleMinutes > 0) IDLE_MINUTES = fy.idleMinutes;
    CAN_PL = TABS.pnl !== false;

    $('tabLedgers').hidden  = TABS.ledgers  === false;
    $('tabExpenses').hidden = TABS.expenses === false;
    $('tabOrders').hidden  = TABS.orders  === false;
    $('tabMoney').hidden   = TABS.money   === false;
    $('tabRecent').hidden  = TABS.recent  === false;
    $('tabPL').hidden      = !CAN_PL;

    // Standing on a screen that has just been taken away, go somewhere allowed
    // rather than sitting on a dead tab waiting for a refusal.
    var on = { ledgers: 'ledgers', expenses: 'expenses', orders: 'orders',
               recent: 'recent', pl: 'pnl', money: 'money' }[VIEW];
    if (on && TABS[on] === false) firstAllowedScreen();
  }

  /**
   * Whether either ledger screen is this login's.
   *
   * The party list and a statement are one request each serving two screens, and
   * the server decides which rows to send from the same two rights — so the app
   * must ask the same question the server does, or the two disagree about
   * whether there is anything to fetch.
   */
  function canSeeAnyLedger() {
    return TABS.ledgers !== false || TABS.expenses !== false;
  }

  /** The leftmost screen this login still has, or a plain message if none. */
  function firstAllowedScreen() {
    if (TABS.ledgers  !== false) return showLedgers();
    if (TABS.expenses !== false) return showExpenses();
    if (TABS.orders  !== false) return showOrders();
    if (TABS.money   !== false) return showMoney();
    if (TABS.recent  !== false) return showRecent();
    if (TABS.pnl     !== false) return showProfitLoss();
    $('main').innerHTML = '<div class="empty">' +
      t('This login has no screens. Ask for access to be turned on.') + '</div>';
  }

  function buildPeriods(fy) {
    FY = fy;
    PERIOD = { from: fy.from, to: fy.to, label: fy.label };

    // One dropdown rather than a row of month chips. Twelve months plus the year
    // plus Dates… never fitted on a phone, so the later months lived off the
    // right-hand edge behind a scroll nobody could see.
    var html = '<select id="periodPick" class="pick">' +
               '<option value="fy">' + esc(fy.label) + '</option>';
    fy.months.forEach(function (m, i) {
      html += '<option value="m' + i + '">' + esc(m.label) + ' ' + m.year + '</option>';
    });
    html += '<option value="range">Dates…</option></select>';
    $('periods').innerHTML = html;

    $('periodPick').onchange = function () {
      var k = this.value;

      if (k === 'range') {
        $('range').hidden = false;
        if (!$('from').value) { $('from').value = FY.from; $('to').value = FY.to; }
        return;
      }
      $('range').hidden = true;

      if (k === 'fy') PERIOD = { from: FY.from, to: FY.to, label: FY.label };
      else {
        var m = FY.months[Number(k.slice(1))];
        PERIOD = { from: m.from, to: m.to, label: m.label + ' ' + m.year };
      }
      reload();
    };

    $('apply').onclick = function () {
      if (!$('from').value || !$('to').value) return;
      PERIOD = { from: $('from').value, to: $('to').value,
                 label: $('from').value + ' to ' + $('to').value };
      reload();
    };
  }

  function reload() {
    if (VIEW === 'pl') { showProfitLoss(); return; }
    // One request serves both ledger screens, so it is asked for whenever
    // EITHER is allowed. Testing only Ledgers here sent a login that has just
    // Expenses to firstAllowedScreen(), which opens Expenses, which arrives
    // back here — round for ever, showing nothing.
    if (!canSeeAnyLedger()) { firstAllowedScreen(); return; }
    // And if the list on screen is the one this login does NOT have, move to the
    // one it does rather than drawing an empty list under its heading.
    if (TABS[LIST] === false) LIST = LIST === 'expenses' ? 'ledgers' : 'expenses';
    if (current) { openLedger(current); return; }
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';
    var ticket = takeTicket();
    api('parties', { token: TOKEN, from: PERIOD.from, to: PERIOD.to })
      .then(function (r) {
        parties = r.data;                      // the figures are kept either way
        if (stillWanted(ticket)) showList($('search').value);
      })
      .catch(fail);
  }

  // --- profit & loss --------------------------------------------------------

  function showProfitLoss() {
    mark('showProfitLoss');
    if (!CAN_PL) { backToList(); return; }
    VIEW = 'pl';
    current = null;
    setTab('tabPL');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = false;
    $('title').textContent = t('Profit');
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';

    var ticket = takeTicket();
    api('pnl', { token: TOKEN, from: PERIOD.from, to: PERIOD.to }).then(function (r) {
      if (!stillWanted(ticket)) return;
      var d = r.data;

      // Sales are at goods value: GST collected is not income, it passes
      // through. And a purchase is not a cost — it turns money into stock. The
      // cost is what went OUT of the godown, at what it cost to be there.
      var html = '<div class="pl">' +
        '<div class="l head"><span>' + t('Income') + '</span><span></span></div>' +
        line(t('Sales'), d.sales) +
        '<div class="l sub"><span class="note">' +
          'at goods value, no GST' +
        '</span><span></span></div>' +
        line(t('Cost of goods sold'), d.costOfSales) +
        line(t('Gross profit'), d.gross, 'tot') + '</div>';

      // What was sold, item by item (21 Oct 2026). The old note beside Sales said
      // "N units", which added litres to kilos. Each item now shows its own
      // quantity and unit with its sales, as the Profit tab in the sheet does.
      // An older server sends no soldByItem, and then the block is simply absent.
      var sold = d.soldByItem || [];
      if (sold.length) {
        html += '<div class="pl">' +
          '<div class="l head"><span>' + t('What was sold') + '</span><span></span></div>';
        sold.forEach(function (i) {
          var unit = i.unit ? i.unit.charAt(0).toUpperCase() + i.unit.slice(1) : '';
          // Under the name, in the grey sub-line with the quantity: the average
          // price (what it went out at, per unit), so a long name plus quantity
          // plus rate cannot crowd the sales figure at phone width. Left off when
          // the quantity is nil, so nothing is divided by nothing.
          html += '<div class="l sub"><span>' + esc(i.item) + '<br><span class="note">' +
            Number(i.qty).toLocaleString('en-IN', { maximumFractionDigits: 3 }) +
            (unit ? ' ' + esc(unit) : '') +
            (Number(i.qty) > 0 ? ' · @ ' + money(i.sales / i.qty) : '') +
            '</span></span>' +
            '<span class="v">' + money(i.sales) + '</span></div>';
        });
        html += '</div>';
      }

      html += '<div class="pl">' +
        '<div class="l head"><span>' + t('Expenses') + '</span><span></span></div>';

      d.expenses.forEach(function (e) { html += line(e.name, e.amount, 'sub'); });
      if (!d.expenses.length) {
        html += '<div class="l sub"><span class="note">No expenses in this period</span><span></span></div>';
      }

      html += line(t('Total expenses'), d.expenseTotal, 'tot');
      // The server says what the rate was charged ON (tLossBasis, since 16 Oct
      // 2026: the oil's sales, not all sales). Printing '% of sales' here would
      // be a label disagreeing with its own number. An older server sends no
      // basis, and then the old wording is still true.
      html += line(d.tLossRate ? 'T Loss (' + Math.round(d.tLossRate * 100) + '% of ' +
                   (d.tLossBasis || 'sales') + ')' : 'T Loss',
                   d.tLoss) + '</div>';

      // Bills entered on the Expense tab and not yet paid. Shown apart from the
      // costs on purpose: nothing has been spent, so it is not a cost yet —
      // but it should not look as though those entries went nowhere.
      if (d.billsRecorded || d.purchases) {
        html += '<div class="pl">';
        if (d.purchases) {
          html += '<div class="l"><span class="note">' + t('Stock bought in this period') + '</span>' +
            '<span class="note v">' + money(d.purchases) + '</span></div>' +
            '<div class="l"><span class="note">Counted when the goods are sold</span>' +
            '<span></span></div>';
        }
        if (d.billsRecorded) {
          html += '<div class="l"><span class="note">' + t('Bills recorded, not yet paid') + '</span>' +
            '<span class="note v">' + money(d.billsRecorded) + '</span></div>' +
            '<div class="l"><span class="note">Counted when the money leaves</span>' +
            '<span></span></div>';
        }
        html += '</div>';
      }

      html += '<div class="pl"><div class="l">' +
        '<span class="net">' + t('Net') + '</span>' +
        '<span class="net v ' + (d.net >= 0 ? 'cr' : 'loss') + '">' +
        (d.net < 0 ? '(' + money(d.net) + ')' : money(d.net)) + '</span></div>' +
        '<div class="l"><span class="note">' + esc(PERIOD.label) + '</span>' +
        '<span class="note">' + (d.net >= 0 ? 'profit' : 'loss') + '</span></div></div>';

      // The owner's own figure, kept by him on the right of Jolly's Production
      // tab (owner, 30 Oct 2026). It is BELOW the Net and counted in nothing —
      // the server does not add it to any total and neither does this. An older
      // server, or a cell nobody has filled in, sends null and the block is
      // simply absent: a 0.00 here would say "the difference is nil", which is
      // not what an empty cell means.
      if (typeof d.current === 'number') {
        html += '<div class="pl"><div class="l">' +
          '<span>' + t('Current') + '</span>' +
          '<span class="v">' + money(d.current) + '</span></div>' +
          '<div class="l"><span class="note">' +
          'kept by hand, not part of the figures above' +
          '</span><span></span></div></div>';
      }

      $('main').innerHTML = html;
    }).catch(fail);
  }

  function line(label, value, cls2) {
    return '<div class="l ' + (cls2 || '') + '"><span>' + esc(label) + '</span>' +
           '<span class="v ' + (cls2 === 'tot' ? 'tot' : '') + '">' + money(value) + '</span></div>';
  }

  /**
   * THE TWO LEDGER SCREENS, which are one list read two ways.
   *
   * Every expense head has a row in the Parties tab — a category is a ledger
   * like any other here, which is what gives it a balance and a statement — so
   * for a year the Ledgers screen listed the customers you chase for money in
   * among heads you only ever spend under. The two are looked at for entirely
   * different reasons and one list cannot serve both.
   *
   * The split is the Kind column on that tab, which the sheet fills in from the
   * Categories and Assets lists. NOTHING HERE DECIDES WHAT AN EXPENSE IS: a
   * screen guessing from the name would put Transport with the costs, and
   * Transport Traders with them too.
   *
   * ONE request serves both. The party list takes about twelve seconds, and
   * asking again for something that differs only in which rows are drawn would
   * make switching tabs cost the whole wait a second time.
   */
  var LIST = 'ledgers';           // which of the two is on screen

  function showLedgers() { openListScreen('ledgers'); }
  function showExpenses() { openListScreen('expenses'); }

  function openListScreen(which) {
    mark('show' + (which === 'expenses' ? 'Expenses' : 'Ledgers'));
    LIST = which;
    VIEW = which;
    current = null;
    setTab(which === 'expenses' ? 'tabExpenses' : 'tabLedgers');
    $('search').hidden = false; $('back').hidden = true;
    $('periods').hidden = false;
    $('search').placeholder = t(searchPrompt());
    $('title').textContent = t(listTitle());
    reload();
  }

  /** What the heading says, what the search box asks for, where Back goes. */
  function listTitle() { return LIST === 'expenses' ? 'Expenses' : 'Ledgers'; }
  function searchPrompt() {
    return LIST === 'expenses' ? 'Search an expense head' : 'Search a party';
  }
  function backLabel() {
    return LIST === 'expenses' ? '\u2039 All expenses' : '\u2039 All parties';
  }

  /**
   * Which screen the app is showing, as a number that changes every time you
   * switch.
   *
   * THE BUG THIS EXISTS FOR. The sheet takes about twelve seconds to answer.
   * Tap a party, then tap Orders before it replies, and the order form appears
   * at once — and then the ledger's answer arrives and paints itself over the
   * top, restoring the party's title and back button. The tab still says Orders
   * because Orders really did open. It looks exactly like the app ignoring the
   * tap, and it happens every time the wait is long, which is always.
   *
   * So every screen takes a ticket before it asks for anything, and throws the
   * answer away if the ticket is no longer current. A late reply is not wrong,
   * it is simply no longer wanted.
   */
  var viewSeq = 0;
  function takeTicket() { return ++viewSeq; }
  function stillWanted(ticket) { return ticket === viewSeq; }

  /**
   * A short trail of which screen opened when, shown by tapping the build stamp.
   *
   * Put here because a fault was reported three times that could not be
   * reproduced: the screen jumped to a ledger and neither of us could say which
   * tap did it. A screenshot shows the result; this shows the cause.
   */
  var trail = [];
  function mark(what) {
    trail.push(new Date().toLocaleTimeString() + '  ' + what);
    if (trail.length > 14) trail.shift();
  }
  function showTrail() {
    $('main').innerHTML =
      '<div class="msg">' + esc(trail.join('\n') || 'Nothing yet.') + '</div>' +
      '<button class="more" id="backfromtrail">Back</button>';
    $('backfromtrail').onclick = showLedgers;
  }

  function setTab(which) {
    ['tabLedgers', 'tabExpenses', 'tabOrders', 'tabMoney', 'tabRecent', 'tabPL'].forEach(function (id) {
      $(id).classList.toggle('on', id === which);
    });
  }

  // --- the Money tab: Received / Paid / Expense -------------------------------

  /**
   * Enter a receipt, a payment or an expense from the phone (§4i).
   *
   * Saving writes ONE ROW INTO JOLLY, not the ledger. The posting run takes it
   * from there, so a saved entry is WAITING, and this screen says exactly what
   * the server says about that and nothing more. The ledger has not moved.
   *
   * Received and Paid choose a party and may tick the bills they clear. The
   * ticks are optional: with none, the server clears the oldest first by itself
   * (§4h FIFO), which is what the note says. Expense chooses a head; an expense
   * is not a bill, so there are no bills and no `against`.
   */
  var MONEY_LISTS = null;        // { parties, heads, accounts }, fetched once
  var MONEY = null;              // what the form holds, kept while you move about
  var moneySaving = false;       // a second tap while one is in flight does nothing
  var billSeq = 0;               // a slow answer for the party you left is thrown away

  function freshMoney(keep) {
    return { kind: (keep && keep.kind) || 'Received',
             party: '', date: (keep && keep.date) || todayISO(), amount: '',
             account: (keep && keep.account) || '', paidFrom: (keep && keep.paidFrom) || '',
             narration: '', raw: [], bills: [], billsFor: '', loading: false, loadErr: '',
             ticked: {}, manual: false, msg: '' };
  }

  function showMoney() {
    mark('showMoney');
    VIEW = 'money';
    current = null;
    setTab('tabMoney');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = t('Money');
    if (!MONEY) MONEY = freshMoney();
    loadPending();
    if (MONEY_LISTS) { drawMoney(); return; }
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';

    var ticket = takeTicket();
    api('moneyLists', { token: TOKEN })
      .then(function (r) {
        MONEY_LISTS = r.data;
        if (stillWanted(ticket)) drawMoney();
      })
      .catch(fail);
  }

  /** The list's own spelling of a typed name, or '' if it is not on the list. */
  function moneyName(typed) {
    var names = MONEY.kind === 'Expense' ? MONEY_LISTS.heads : MONEY_LISTS.parties;
    var hit = '';
    names.forEach(function (n) { if (sameName(n, typed || '')) hit = n; });
    return hit;
  }

  function drawMoney() {
    var m = MONEY, exp = m.kind === 'Expense';
    var names = exp ? MONEY_LISTS.heads : MONEY_LISTS.parties;
    var accounts = MONEY_LISTS.accounts || ['HDFC', 'CB'];

    var html =
      (m.msg ? '<div class="msg" style="margin-top:0;margin-bottom:12px">' + esc(m.msg) + '</div>' : '') +
      '<div class="g3">' +
        ['Received', 'Paid', 'Expense'].map(function (k) {
          return '<button class="' + (k === m.kind ? 'primary' : 'more') + '" data-kind="' + k +
                 '" style="margin-top:0;padding:11px 4px;font-size:15px">' + t(k) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="field"><label>' + t(exp ? 'Expense' : 'Party') + '</label>' +
        '<input id="mparty" list="moneyNames" autocomplete="off" value="' + esc(m.party) + '"></div>' +
      '<datalist id="moneyNames">' +
        names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') +
      '</datalist>' +
      '<div class="g2">' +
        '<div class="field"><label>' + t('Date') + '</label>' +
          '<input type="date" id="mdate" value="' + esc(m.date) + '"></div>' +
        '<div class="field"><label>' + t('Amount') + '</label>' +
          '<input type="number" inputmode="decimal" step="0.01" id="mamount" value="' + esc(m.amount) + '"></div>' +
      '</div>' +
      (exp
        // Blank is a real answer here and means PAID (§2, 7 Oct 2026), so the
        // label says so rather than leaving an empty box to mean something.
        ? '<div class="field"><label>' + t('Paid from') + ' <span class="note">· ' +
            t('Leave blank if it was paid') + '</span></label>' +
            '<select id="mpaid"><option value=""></option>' + options(accounts, m.paidFrom) + '</select></div>'
        : '<div class="field"><label>' + t('Account') + '</label>' +
            '<select id="maccount"><option value=""></option>' + options(accounts, m.account) + '</select></div>' +
          '<div id="mbills"></div>') +
      '<div class="field"><label>' + t('Narration') + ' <span class="note">' + t('opt.') + '</span></label>' +
        '<input id="mnote" autocomplete="off" value="' + esc(m.narration) + '"></div>' +
      '<p class="error" id="merr" hidden></p>' +
      '<button class="primary" id="msave">' + t('Save') + '</button>' +
      '<div id="mpending"></div>';

    $('main').innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('[data-kind]'), function (el) {
      el.onclick = function () { setMoneyKind(el.dataset.kind); };
    });
    $('mparty').oninput = $('mparty').onchange = function () {
      m.party = this.value;
      pickMoneyParty();
    };
    $('mdate').onchange = $('mdate').oninput = function () { m.date = this.value; };
    $('mamount').oninput = function () {
      m.amount = this.value;
      // The ticks follow the amount unless somebody has taken them over.
      if (!m.manual) autoTick();
      drawBills();
    };
    $('mnote').oninput = function () { m.narration = this.value; };
    if ($('maccount')) $('maccount').onchange = function () { m.account = this.value; };
    if ($('mpaid')) $('mpaid').onchange = function () { m.paidFrom = this.value; };
    $('msave').onclick = saveMoney;
    drawBills();
    drawPending();
  }

  /**
   * Rows put into Jolly from the Money screen that have not posted yet. It only
   * READS (moneyPending): nothing here clears a Status or re-posts a row.
   *
   * It lists every waiting row on HDFC, CB and Expense, not only this login's —
   * Jolly records no author, deliberately, so it is not filtered or labelled as
   * "yours". An empty Status is a row simply waiting its turn: ordinary and
   * quiet. Text in Status is the posting run's refusal, and that is a payment
   * somebody believes is recorded and is not, so it is loud.
   */
  var MONEY_PENDING = null, pendingErr = '', pendingSeq = 0;

  function loadPending() {
    var seq = ++pendingSeq;
    return api('moneyPending', { token: TOKEN })
      .then(function (r) {
        if (seq !== pendingSeq) return;
        MONEY_PENDING = r.data || []; pendingErr = '';
        drawPending();
      })
      .catch(function (e) {
        if (seq !== pendingSeq) return;
        if (e.expired) { fail(e); return; }
        pendingErr = e.message;
        drawPending();
      });
  }

  function pendingLine(p) {
    return esc(p.date) + ' · ' + esc(p.party) + ' · ' + money(p.amount) +
           (p.kind ? ' ' + esc(t(p.kind)) : '') + (p.ref ? ' · ' + esc(p.ref) : '');
  }

  function drawPending() {
    var box = $('mpending');
    if (!box || VIEW !== 'money') return;
    if (pendingErr) { box.innerHTML = '<p class="error">' + esc(pendingErr) + '</p>'; return; }
    var all = MONEY_PENDING || [];
    var refused = all.filter(function (p) { return p.status; });
    var waiting = all.filter(function (p) { return !p.status; });
    var html = '';

    if (refused.length) {
      html += '<div class="msg" style="color:var(--dr);border-color:var(--dr)">' +
        '<b>' + t('Refused') + ' (' + refused.length + ')</b>' +
        refused.map(function (p) {
          return '<div style="margin-top:8px">' + pendingLine(p) +
                 '<br><b>' + esc(p.status) + '</b></div>';
        }).join('') + '</div>';
    }
    if (waiting.length) {
      html += '<div class="card"><div class="head"><b class="note">' + t('Waiting to post') +
        ' (' + waiting.length + ')</b></div>' +
        waiting.map(function (p) {
          return '<div class="note" style="margin-top:6px">' + pendingLine(p) + '</div>';
        }).join('') + '</div>';
    }
    box.innerHTML = html;
  }

  function setMoneyKind(kind) {
    var m = MONEY;
    if (kind === m.kind) return;
    var crossing = (kind === 'Expense') !== (m.kind === 'Expense');
    m.kind = kind;
    m.msg = '';
    if (crossing) {
      // Heads and parties are different lists: a name from one is not on the other.
      m.party = ''; m.raw = []; m.bills = []; m.billsFor = ''; m.ticked = {}; m.manual = false;
      billSeq++;
    } else {
      refilterBills();
      m.manual = false;
      autoTick();
    }
    drawMoney();
  }

  /**
   * Which of the party's open items this entry could clear. A receipt credits
   * the party, so it clears debits (what they owe us); a payment debits the
   * party, so it clears credits (what we owe them). The rule is by sign, as in
   * Settle.gs, so it serves customers and suppliers alike.
   */
  function refilterBills() {
    var m = MONEY, want = m.kind === 'Received' ? 'Dr' : 'Cr';
    m.bills = m.raw.filter(function (b) { return b.side === want; });
  }

  /** A name was typed or picked: fetch that party's open bills, once. */
  function pickMoneyParty() {
    var m = MONEY;
    if (m.kind === 'Expense') return;
    var name = moneyName(m.party);
    if (!name) {
      billSeq++;
      m.raw = []; m.bills = []; m.billsFor = ''; m.ticked = {}; m.loading = false; m.loadErr = '';
      drawBills();
      return;
    }
    if (name === m.billsFor) return;

    var seq = ++billSeq;
    m.billsFor = name; m.raw = []; m.bills = []; m.ticked = {}; m.manual = false;
    m.loading = true; m.loadErr = '';
    drawBills();

    api('openBills', { token: TOKEN, party: name })
      .then(function (r) {
        if (seq !== billSeq || MONEY !== m) return;     // the party was changed meanwhile
        m.raw = (r.data && r.data.bills) || [];
        m.loading = false;
        refilterBills();
        autoTick();
        drawBills();
      })
      .catch(function (e) {
        if (seq !== billSeq || MONEY !== m) return;
        m.loading = false; m.billsFor = '';
        m.loadErr = e.message;
        drawBills();
        if (e.expired) fail(e);
      });
  }

  /**
   * Tick the oldest bills, in order, up to the amount typed. A bill the amount
   * only partly covers is ticked too: a short payment leaving part of a bill
   * open is the ordinary case, and the tally below says so.
   */
  function autoTick() {
    var m = MONEY, left = Number(m.amount) || 0;
    m.ticked = {};
    m.bills.forEach(function (b, i) {
      if (left > 0.004) m.ticked[i] = true;
      left -= b.open;
    });
  }

  /** The bills ticked, oldest first, and what they come to. */
  function tickedBills() {
    var m = MONEY, out = [], sum = 0;
    m.bills.forEach(function (b, i) {
      if (m.ticked[i]) { out.push(b); sum += b.open; }
    });
    return { bills: out, sum: Math.round(sum * 100) / 100 };
  }

  /** Open totals of the unfiltered list, per side, from MONEY.raw (already held). */
  function openTotals() {
    var dr = 0, cr = 0;
    MONEY.raw.forEach(function (b) { if (b.side === 'Dr') dr += b.open; else cr += b.open; });
    return { dr: Math.round(dr * 100) / 100, cr: Math.round(cr * 100) / 100 };
  }
  /** The side the chosen kind does NOT show, and what is open on it. */
  function otherSide() {
    var o = openTotals(), dr = MONEY.kind === 'Paid';   // Paid shows Cr, so the hidden side is Dr
    return { side: dr ? 'Dr' : 'Cr', total: dr ? o.dr : o.cr };
  }
  function positionText() {
    var o = openTotals(), parts = [];
    if (o.dr > 0.004) parts.push(money(o.dr) + ' Dr');
    if (o.cr > 0.004) parts.push(money(o.cr) + ' Cr');
    return esc(parts.length ? parts.join(' \u00b7 ') : '0.00');
  }

  function drawBills() {
    var box = $('mbills');
    if (!box || VIEW !== 'money') return;
    var m = MONEY;

    if (!m.billsFor) { box.innerHTML = m.loadErr ? '<p class="error">' + esc(m.loadErr) + '</p>' : ''; return; }

    var html = '<div class="card"><div class="head"><b>' + t('Which bills does this clear?') + '</b></div>';
    if (!m.loading) html += '<p class="note">' + t('Open on this ledger') + ': ' + positionText() + '</p>';
    if (m.loading) {
      html += '<p class="note">' + t('Loading…') + '</p>';
    } else if (!m.bills.length) {
      var oth = otherSide();
      if (oth.total) {
        // Normal, not a mistake: the open items are on the other side.
        var toRec = m.kind === 'Received';       // empty Received means only Cr items exist
        var tpl = toRec
          ? 'Nothing here for a receipt. This ledger has {n} {s} open, which a Paid clears.'
          : 'Nothing here for a payment. This ledger has {n} {s} open, which a Received clears.';
        var go = toRec ? 'Paid' : 'Received';
        html += '<p class="note">' +
          esc(t(tpl).replace('{n}', money(oth.total)).replace('{s}', oth.side)) + '</p>' +
          '<button class="more" id="mswitch" style="margin-top:8px">' +
          esc(t('Switch to ' + go)) + '</button>';
      } else {
        html += '<p class="note">' + t('This ledger is square. Nothing is open on either side.') + '</p>';
      }
    } else {
      m.bills.forEach(function (b, i) {
        html += '<label class="tick"><input type="checkbox" data-b="' + i + '"' +
          (m.ticked[i] ? ' checked' : '') + '>' +
          '<span style="flex:1">' + esc(b.date) + ' · ' +
            (b.source === 'Opening' ? t('Opening balance') : esc(b.ref || b.source)) + '</span>' +
          '<span class="amt">' + money(b.open) + ' <span class="tag">' + esc(b.side) + '</span></span></label>';
      });

      var tk = tickedBills(), amt = Number(m.amount) || 0;
      html += '<p class="note" style="margin-top:12px"><b>' + t('Ticked') + ': ' + money(tk.sum) +
        ' / ' + money(amt) + '</b><br>';
      if (!tk.bills.length) {
        html += t('Nothing ticked — the oldest bills will be cleared first');
      } else if (Math.abs(tk.sum - amt) < 0.005) {
        html += t('Ticked bills agree with the amount.');
      } else if (tk.sum > amt) {
        // Normal, not an error: a short payment leaves part of the last bill open.
        html += t('Ticked bills come to more than the amount. The last one stays part open.');
      } else {
        html += t('Ticked bills come to less than the amount. The rest clears the oldest open bills.');
      }
      html += '</p>';
    }
    box.innerHTML = html + '</div>';

    var sw = $('mswitch');
    if (sw) sw.onclick = function () { setMoneyKind(m.kind === 'Received' ? 'Paid' : 'Received'); };
    Array.prototype.forEach.call(box.querySelectorAll('[data-b]'), function (el) {
      el.onchange = function () {
        m.ticked[+el.dataset.b] = el.checked;
        m.manual = true;                  // from here the ticks are theirs
        drawBills();
      };
    });
  }

  function saveMoney() {
    if (moneySaving) return;              // a double tap must not become two payments
    var m = MONEY, exp = m.kind === 'Expense';
    moneySaving = true;
    $('msave').disabled = true;
    $('msave').textContent = t('Saving…');
    $('merr').hidden = true;

    var body = { token: TOKEN, kind: m.kind,
                 account: exp ? m.paidFrom : m.account,   // blank on an expense means paid
                 party: moneyName(m.party) || m.party.trim(),
                 date: m.date, amount: m.amount, narration: m.narration.trim() };
    if (!exp) {
      // The references of the ticked bills. None ticked: blank, and the server
      // clears the oldest first by itself.
      body.against = tickedBills().bills.map(function (b) { return b.ref; })
        .filter(function (r) { return r; }).join(', ');
    }

    api('money', body)
      .then(function (r) {
        moneySaving = false;
        // A fresh form, so nothing typed can be saved a second time. The bills are
        // NOT still open on paper once this posts, and the ledger has not moved yet,
        // so the old list is dropped rather than offered again.
        MONEY = freshMoney(m);
        MONEY.msg = (r.data && r.data.message) || '';
        if (VIEW === 'money') drawMoney();
        loadPending();               // the row just made belongs on the list
      })
      .catch(function (e) {
        moneySaving = false;
        if (e.expired) { fail(e); return; }
        if ($('msave')) {
          $('msave').disabled = false;
          $('msave').textContent = t('Save');
          $('merr').textContent = e.message;       // the server's sentence, as it is
          $('merr').hidden = false;
        }
      });
  }

  // --- what has been posted lately ------------------------------------------

  /**
   * The last three days of postings into Zen: day by day, and each day split
   * into Sale, Purchase, Expense, Payment and Receipt.
   *
   * A day here is the day it was POSTED, not the date typed on the bill —
   * that is what makes it a report of the sync. Each row still carries its own
   * date underneath, so a bill entered late is visible as exactly that.
   *
   * It has NO period picker on purpose. Every other screen answers "how does
   * this period look"; this one answers "what has gone in lately", and a period
   * chosen up in the header would make those two questions look like one.
   */
  var RECENT_BY = 'day';       // 'day' or 'kind'

  function showRecent() {
    mark('showRecent');
    VIEW = 'recent';
    current = null;
    setTab('tabRecent');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = t('Recent');
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';

    var ticket = takeTicket();
    // No number sent on purpose. The server reads "Recent covers (days)" from
    // the App Settings tab, and a number sent from here would override it —
    // which is exactly what made changing that setting do nothing.
    api('recent', { token: TOKEN }).then(function (r) {
      if (!stillWanted(ticket)) return;
      drawRecent(r.data);
    }).catch(fail);
  }

  /** One posted entry: party, then where it came from underneath. */
  function recentRow(row) {
    // Particulars is the working the sync wrote, which is what makes a bank
    // line readable without opening the sheet.
    // The posting time is deliberately left out: the day is the report's own
    // heading, and the minute it was keyed in answers nothing anybody asks.
    var sub = [row.date, row.ref, row.via].filter(Boolean).map(esc).join(' · ');
    return '<div class="l">' +
      '<span><span class="name">' + esc(row.party || '—') + '</span>' +
        '<div class="sub">' + sub +
        (row.particulars ? '<br>' + esc(row.particulars) : '') + '</div></span>' +
      '<span class="v">' + money(row.amount) + '</span></div>';
  }

  /**
   * A kind and its entries, as a heading line and the rows under it. Nested
   * under a day it is indented, so the day reads as the heading and the kind as
   * a part of it rather than the two competing.
   */
  function recentGroup(g, nested) {
    return '<div class="l head' + (nested ? ' sub' : '') + '"><span>' + esc(t(g.kind)) + '</span>' +
      '<span class="v">' + g.count + ' · ' + money(g.total) + '</span></div>' +
      g.rows.map(recentRow).join('');
  }

  function drawRecent(d) {
    // byDay arrived after the app shipped, so a phone holding a cached build
    // must still be served by the kind view alone.
    var days = d.byDay || [];

    if (!d.groups.length) {
      $('main').innerHTML = '<div class="empty">' + sinceLine('Nothing posted since', d.from) + '.</div>';
      return;
    }

    var head =
      '<div class="bar" style="margin-bottom:10px">' +
        '<span class="note">' + sinceLine('Posted since', d.from) + '</span>' +
        (days.length
          ? '<button class="link" id="recentBy">' +
              t(RECENT_BY === 'day' ? 'By kind' : 'By day') + '</button>'
          : '') +
      '</div>';

    var body = (RECENT_BY === 'day' && days.length)
      ? days.map(function (day) {
          return '<div class="pl">' +
            '<div class="l head"><span>' + esc(day.day) + '</span>' +
            '<span class="v">' + day.count + ' · ' + money(day.total) + '</span></div>' +
            day.groups.map(function (g) { return recentGroup(g, true); }).join('') +
          '</div>';
        }).join('')
      : d.groups.map(function (g) {
          return '<div class="pl">' + recentGroup(g) + '</div>';
        }).join('');

    $('main').innerHTML = head + body;

    if ($('recentBy')) {
      $('recentBy').onclick = function () {
        RECENT_BY = RECENT_BY === 'day' ? 'kind' : 'day';
        drawRecent(d);            // already fetched; no second round trip
      };
    }
  }

  // --- the day's chalans, and correcting one --------------------------------

  /** Which chalan is being corrected, or null when placing a new one. */
  var EDITING = null;

  /**
   * What was ordered today, so a wrong rate or a wrong party is caught while
   * it is still only a row in Jolly.
   *
   * A delivered chalan is listed and NOT editable. Seeing it is the point: it
   * explains why it cannot be changed here. Leaving it out would read as the
   * order having vanished.
   */
  function showTodaysOrders() {
    mark('showTodaysOrders');
    VIEW = 'orders';
    current = null;
    setTab('tabOrders');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = t("Today's orders");
    $('main').innerHTML = '<div class="empty">' + t('Loading\u2026') + '</div>';

    var ticket = takeTicket();
    api('ordersRecent', { token: TOKEN, days: 1 }).then(function (r) {
      if (!stillWanted(ticket)) return;
      var orders = r.data || [];

      if (!orders.length) {
        $('main').innerHTML = '<div class="empty">' + t('Nothing ordered today.') + '</div>' +
          '<button class="more" id="neworder">' + t('New order') + '</button>';
        $('neworder').onclick = function () { EDITING = null; showOrders(); };
        return;
      }

      $('main').innerHTML = orders.map(function (o, i) {
        var state = o.delivered ? t('Delivered') : (o.sent ? t('Sent') : t('Not sent'));
        return '<div class="card">' +
          '<div class="head"><b>' + esc(o.party) + '</b>' +
            '<span class="note">' + esc(o.orderNo) + ' \u00b7 ' + esc(state) + '</span></div>' +
          o.lines.map(function (l) {
            return '<div class="note" style="margin-top:6px">' + esc(orderLineText(l)) + '</div>';
          }).join('') +
          '<div class="total"><span>' + t('Total') + '</span><span>' + money(o.total) + '</span></div>' +
          (o.delivered
            ? '<div class="note">' + t('Delivered \u2014 correct it in Jolly') + '</div>'
            : '<button class="more" data-edit="' + i + '">' + t('Edit') + '</button>') +
        '</div>';
      }).join('') +
      '<button class="more" id="neworder">' + t('New order') + '</button>';

      Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (el) {
        el.onclick = function () { openForEdit(orders[+el.dataset.edit]); };
      });
      $('neworder').onclick = function () { EDITING = null; showOrders(); };
    }).catch(fail);
  }

  /**
   * Remove the chalan being corrected.
   *
   * Confirmed first, and said plainly: this is the one action on these screens
   * that destroys something rather than changing it. The server refuses a
   * delivered order anyway, so the confirmation is about intent, not safety.
   */
  function deleteThisOrder() {
    if (!EDITING) return;
    if (!confirm(t('Delete this order? This cannot be undone.'))) return;

    var was = EDITING;
    $('killorder').disabled = true;
    api('orderDelete', { token: TOKEN, orderNo: was.orderNo })
      .then(function (r) {
        EDITING = null;
        draft = []; draftParty = ''; draftNote = '';
        showBatch('Order ' + was.orderNo + ' deleted.' +
                  (r.data && r.data.wasSent
                    ? '\n' + t('The plant already has the old figures \u2014 send it again.')
                    : ''));
      })
      .catch(function (e) {
        if ($('killorder')) $('killorder').disabled = false;
        alert(e.message);
      });
  }

  /** One line, in the shorthand the plant is already sent. */
  function orderLineText(l) {
    return l.item + '   ' + trimNum(l.qty) + ' \u00d7 ' + trimNum(l.rate) + '/-' +
      (l.packs ? '  (' + trimNum(l.packs) + (l.pack ? ' ' + l.pack : '') + ')' : '') +
      (l.gst ? ' + GST' : '');
  }

  /**
   * Correcting an order REUSES the order form, so an edit is checked exactly as
   * a new order is. The server shares its line checking for the same reason: the
   * path used less often is the one that would drift, and an edit is a
   * correction made in a hurry.
   */
  function openForEdit(order) {
    mark('openForEdit(' + order.orderNo + ')');
    EDITING = order;
    draftParty = order.party;
    draftNote = order.notes || '';
    draft = order.lines.map(function (l) {
      return { item: l.item, pack: l.pack, qty: Number(l.qty) || 0,
               packs: Number(l.packs) || 0, rate: Number(l.rate) || 0, gst: !!l.gst };
    });
    showOrders();
  }

  // --- orders ---------------------------------------------------------------

  var lists = null;      // items and pack types, fetched once
  var draft = [];        // the lines being typed, before the order is saved

  /**
   * Placing an order writes the entry into Jolly straight away, unticked. It
   * reaches the ledger only when somebody confirms delivery there — so this
   * screen can be used freely without anything landing in the books.
   */
  function showOrders() {
    mark('showOrders');
    VIEW = 'orders';
    current = null;
    setTab('tabOrders');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = EDITING ? t('Save changes') : t('New order');
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';

    var ticket = takeTicket();
    if (lists) { drawOrderForm(); return; }
    api('lists', { token: TOKEN })
      .then(function (r) {
        lists = r.data;
        if (stillWanted(ticket)) drawOrderForm();
      })
      .catch(fail);
  }

  function options(values, chosen) {
    return values.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === chosen ? ' selected' : '') + '>' +
             esc(v) + '</option>';
    }).join('');
  }

  function drawOrderForm(note) {
    if (!draft.length) draft = [blankLine()];

    var html =
      (note ? '<div class="msg">' + esc(note) + '</div>' : '') +
      '<div class="field"><label>' + t('Party') + '</label>' +
        '<input id="oparty" list="partyList" autocomplete="off" ' +
               'placeholder="' + t('Pick one, or type a new name') + '" value="' + esc(draftParty) + '">' +
        '<p class="note" id="partynote" style="margin:6px 0 0"></p></div>' +
      '<datalist id="partyList">' +
        parties.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') +
      '</datalist>' +
      // An edit opens on the order's OWN date. Defaulting to today would
      // silently move a chalan placed yesterday into today's numbering and
      // today's day book, which is a different order in every way that counts.
      '<div class="field"><label>' + t('Date') + '</label><input type="date" id="odate" value="' +
        ((EDITING && EDITING.dateISO) || todayISO()) + '"></div>' +
      // One note for the order, not one per line. It rides to the Narration
      // column of every entry the order makes, and into the message, so the
      // plant reads the same instruction the ledger keeps.
      '<div class="field"><label>' + t('Narration') + ' <span class="note">' + t('opt.') + '</span></label>' +
        '<input id="onote" autocomplete="off" placeholder="' + t('Anything the plant should know') + '" ' +
               'value="' + esc(draftNote) + '"></div>';

    draft.forEach(function (l, i) {
      html +=
        '<div class="card" data-i="' + i + '">' +
          '<div class="head"><b>' + t('Line') + ' ' + (i + 1) + '</b>' +
            (draft.length > 1 ? '<button class="link drop" data-i="' + i + '">' + t('Remove') + '</button>' : '') +
          '</div>' +
          '<div class="field"><label>' + t('Item') + '</label>' +
            '<select class="f" data-k="item" data-i="' + i + '">' +
              '<option value=""></option>' + options(lists.items, l.item) +
            '</select></div>' +
          '<div class="g3">' +
            '<div class="field"><label>' + t('Pack') + '</label>' +
              '<select class="f" data-k="pack" data-i="' + i + '">' +
                options(lists.packs, l.pack) +
              '</select></div>' +
            '<div class="field"><label>' + t('Qty') + '</label>' +
              '<input class="f" data-k="qty" data-i="' + i + '" type="number" ' +
                     'inputmode="decimal" value="' + (l.qty || '') + '"></div>' +
            // Optional: it never touches the price. It is here so a load can be
            // checked in the unit it is actually counted in — you count cans,
            // you bill kilos.
            '<div class="field"><label>' + t('Number') + ' <span class="note">' + t('opt.') + '</span></label>' +
              '<input class="f" data-k="packs" data-i="' + i + '" type="number" ' +
                     'inputmode="decimal" value="' + (l.packs || '') + '"></div>' +
          '</div>' +
          '<div class="g2">' +
            '<div class="field"><label>' + t('Rate') + '</label>' +
              '<input class="f" data-k="rate" data-i="' + i + '" type="number" ' +
                     'inputmode="decimal" value="' + (l.rate || '') + '"></div>' +
            '<div class="field"><label>' + t('Comes to') + '</label>' +
              '<input value="' + money(lineTotal(l)) + '" disabled></div>' +
          '</div>' +
          '<label class="tick"><input class="f" data-k="gst" data-i="' + i + '" ' +
                 'type="checkbox"' + (l.gst ? ' checked' : '') + '> GST 18%</label>' +
        '</div>';
    });

    html +=
      '<button class="more" id="addline">' + t('Add another line') + '</button>' +
      '<div class="total"><span>' + t('Total') + '</span><span>' + money(draftTotal()) + '</span></div>' +
      '<button class="primary" id="place">' +
        (EDITING ? t('Save changes') : t('Place order')) + '</button>' +
      // Deleting is only offered while correcting, and only ever removes the
      // chalan on screen. The server refuses one that is ticked as delivered,
      // because that row is on its way to the ledger.
      (EDITING
        ? '<button class="more" id="killorder">' + t('Delete this order') + '</button>'
        : '') +
      '<button class="more" id="todays">' + t("Today's orders") + '</button>' +
      '<button class="more" id="batch">' + t('Orders waiting to send') + '</button>' +
      '<button class="more" id="newparty">' + t('Open a party with a balance') + '</button>' +
      '<button class="more" id="newcat">' + t('Add an expense category') + '</button>' +
      '<p class="note" style="margin-top:10px">' +
      t('Saving writes the entry into Jolly, not yet delivered. It reaches the ' +
        'ledger when you confirm delivery there.') + '</p>';

    $('main').innerHTML = html;
    wireOrderForm();
  }

  function blankLine() {
    return { item: '', pack: (lists && lists.packs[0]) || '', qty: '', packs: '', rate: '', gst: false };
  }

  var draftParty = '';
  var draftNote = '';

  /** Goods plus exact 18%, with only the total rounded — the same rule the sheet uses. */
  function lineTotal(l) {
    var goods = (Number(l.qty) || 0) * (Number(l.rate) || 0);
    var tax = l.gst ? goods * 0.18 : 0;
    return Math.round(goods + tax);
  }

  function draftTotal() {
    return draft.reduce(function (sum, l) { return sum + lineTotal(l); }, 0);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  /**
   * A party typed here that is not on the list is opened at nil when the entry
   * posts — so a new customer can be served without leaving the app.
   *
   * The catch is that the same thing happens to a misspelling, and a ledger
   * split in two is found months later. The posting run refuses a name too close
   * to one already in use, but that is at the end of the day; saying so HERE,
   * while the name is still being typed, is the difference between a correction
   * and an investigation.
   */
  function sameName(a, b) {
    return a.replace(/\s+/g, ' ').trim().toLowerCase() ===
           b.replace(/\s+/g, ' ').trim().toLowerCase();
  }

  /** How alike two names are: 1 is identical. The sheet uses the same measure. */
  function alike(a, b) {
    a = a.replace(/\s+/g, ' ').trim().toLowerCase();
    b = b.replace(/\s+/g, ' ').trim().toLowerCase();
    var long = a.length >= b.length ? a : b, short = a.length >= b.length ? b : a;
    if (!long.length) return 1;
    var prev = [], i, k;
    for (k = 0; k <= short.length; k++) prev[k] = k;
    for (i = 1; i <= long.length; i++) {
      var cur = [i];
      for (k = 1; k <= short.length; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1,
                          prev[k - 1] + (long.charAt(i - 1) === short.charAt(k - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return (long.length - prev[short.length]) / long.length;
  }

  function judgeParty() {
    var typed = ($('oparty').value || '').trim();
    var note = $('partynote');

    // Said BEFORE anything is typed, not after. A new party can be opened from
    // here, and an affordance nobody can see is one nobody uses — the whole
    // reason for asking "can I not add a party through the app?".
    if (!typed) {
      note.style.color = '';
      note.textContent = t('A name not on the list opens a new party.');
      return;
    }

    var known = null;
    parties.forEach(function (p) { if (sameName(p.name, typed)) known = p; });
    if (known) {
      note.style.color = '';
      // Say where a filled-in rate came from. A figure that appears by itself
      // and says nothing is one nobody checks.
      note.textContent = known.rate
        ? t('Rate') + ' ' + money(known.rate) + ' ' + t(known.gst ? 'with GST' : 'without GST') +
          ' from this party — change it on the line if today is different.'
        : '';
      return;
    }

    var best = null, score = 0;
    parties.forEach(function (p) {
      var s = alike(p.name, typed);
      if (s > score) { score = s; best = p.name; }
    });

    // 0.80. The typos measured between 0.818 and 0.846, and the closest pair of
    // genuinely different shops — Eden Bakery Bhiwandi against Dharavi — sits at
    // 0.750, so the line goes between them with room to spare.
    //
    // It does also catch "Aqsa Bakery" against "Aksha Bakery", which are two real
    // shops. That costs one confirmation the first time such a name is added,
    // and only then; both are on the list afterwards and match exactly.
    if (score >= 0.80) {
      note.style.color = 'var(--dr)';
      note.textContent = t('Looks like') + ' “' + best + '”. ' +
        t('If it really is a different shop, say so — otherwise this entry ' +
          'will be held back.');
    } else {
      note.style.color = 'var(--cr)';
      note.textContent = t('New party — it will be opened at nil when this posts. ' +
        'Use the New Parties tab in Jolly if it starts with a balance.');
    }
  }

  /**
   * Take the rate and GST recorded against the party, for lines that have not
   * been priced yet.
   *
   * It never overwrites a rate you have typed — the party's figure is a starting
   * point, not a ruling — and the note says where it came from, so a rate that
   * is out of date is visible rather than silently believed.
   */
  function applyPartyTerms() {
    var typed = ($('oparty').value || '').trim();
    var p = null;
    parties.forEach(function (q) { if (sameName(q.name, typed)) p = q; });
    if (!p || !p.rate) return false;

    var touched = false;
    draft.forEach(function (l) {
      if (!Number(l.rate)) { l.rate = p.rate; l.gst = !!p.gst; touched = true; }
    });
    return touched ? p : false;
  }

  function wireOrderForm() {
    if ($('todays')) $('todays').onclick = showTodaysOrders;
    if ($('killorder')) $('killorder').onclick = deleteThisOrder;
    $('oparty').oninput = function () { draftParty = this.value; judgeParty(); };
    if ($('onote')) $('onote').oninput = function () { draftNote = this.value; };
    $('oparty').onchange = function () {
      draftParty = this.value;
      var from = applyPartyTerms();
      if (from) drawOrderForm();
      else judgeParty();
    };
    judgeParty();

    Array.prototype.forEach.call(document.querySelectorAll('.f'), function (el) {
      var apply = function () {
        var i = +el.dataset.i, k = el.dataset.k;
        draft[i][k] = (el.type === 'checkbox') ? el.checked : el.value;
        // Redraw only for the things that change a figure, so typing is not
        // interrupted mid-number.
        if (k === 'gst') drawOrderForm();
        else refreshTotals();
      };
      el.onchange = apply;
      if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.oninput = apply;
    });

    Array.prototype.forEach.call(document.querySelectorAll('.drop'), function (el) {
      el.onclick = function () { draft.splice(+el.dataset.i, 1); drawOrderForm(); };
    });

    $('addline').onclick = function () { draft.push(blankLine()); drawOrderForm(); };
    $('place').onclick = placeOrder;
    if ($('batch')) $('batch').onclick = function () { showBatch(); };
    if ($('newparty')) $('newparty').onclick = showNewParty;
    if ($('newcat')) $('newcat').onclick = showNewCategory;
  }

  /**
   * Open a party, with an opening balance, from the app.
   *
   * The New Parties tab in Jolly does the same job, but only for someone who can
   * edit Zen and Hook as well — the menu there runs as whoever clicks it. This
   * goes through the deployment, which runs as the owner, so it works from an
   * account that has no access to those files at all.
   */
  function showNewParty() {
    mark('showNewParty');
    VIEW = 'orders';
    setTab('tabOrders');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = 'New party';

    $('main').innerHTML =
      '<div class="field"><label>Party name</label>' +
        '<input id="pname" autocomplete="off" placeholder="As it should read on the ledger"></div>' +
      '<div class="g2">' +
        '<div class="field"><label>Opening balance</label>' +
          '<input id="popen" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Dr / Cr</label>' +
          '<select id="pside"><option value="Dr">Dr — they owe you</option>' +
          '<option value="Cr">Cr — you owe them</option></select></div>' +
      '</div>' +
      '<button class="primary" id="psave">Open the party</button>' +
      '<button class="more" id="pback">Back to the order</button>' +
      '<p class="note" style="margin-top:10px">It gets its own ledger at once. ' +
      'Leave the balance at nil if they are starting fresh.</p>';

    $('pback').onclick = showOrders;
    $('psave').onclick = function () {
      var name = ($('pname').value || '').trim();
      if (!name) { alert('Give the party a name.'); return; }

      $('psave').disabled = true;
      $('psave').textContent = 'Opening…';

      api('partyNew', { token: TOKEN, name: name,
                        opening: $('popen').value, side: $('pside').value })
        .then(function (r) {
          // The list the order form offers is now out of date, so it is
          // refetched rather than patched — one source, not two.
          parties = [];
          return api('parties', { token: TOKEN, from: PERIOD.from, to: PERIOD.to })
            .then(function (p) { parties = p.data; return r; });
        })
        .then(function (r) {
          draftParty = r.data.name;
          showOrders();
          alert(r.data.message);
        })
        .catch(function (e) {
          $('psave').disabled = false;
          $('psave').textContent = 'Open the party';
          alert(e.message);
        });
    };
  }

  /**
   * Opens a new expense head from the app.
   *
   * A category is a ledger like any other here, so this is the same act as
   * opening a party — it just always starts at nil, because an expense head
   * does not carry a balance forward from anywhere.
   */
  function showNewCategory() {
    mark('showNewCategory');
    VIEW = 'orders';
    setTab('tabOrders');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = 'New expense head';

    $('main').innerHTML =
      '<div class="field"><label>Category name</label>' +
        '<input id="cname" autocomplete="off" placeholder="Rent, Electricity, Diesel…"></div>' +
      '<button class="primary" id="csave">Add the category</button>' +
      '<button class="more" id="cback">Back to the order</button>' +
      '<p class="note" style="margin-top:10px">It appears in the Category ' +
      'dropdown on the Expense tab straight away, and gets its own ledger.</p>' +
      '<div id="clist" class="note" style="margin-top:14px"></div>';

    // What already exists, so nobody adds a second spelling of a head that is
    // already there — the commonest way an expense total quietly splits in two.
    api('lists', { token: TOKEN }).then(function (r) {
      var cats = (r.data && r.data.categories) || [];
      if (!cats.length) return;
      $('clist').innerHTML = 'Already in use:<br>' + cats.map(esc).join(' · ');
    }).catch(function () {});

    $('cback').onclick = showOrders;
    $('csave').onclick = function () {
      var name = ($('cname').value || '').trim();
      if (!name) { alert('Give the category a name.'); return; }

      $('csave').disabled = true;
      $('csave').textContent = 'Adding…';

      api('categoryNew', { token: TOKEN, name: name })
        .then(function (r) {
          showOrders();
          alert(r.data.message);
        })
        .catch(function (e) {
          $('csave').disabled = false;
          $('csave').textContent = 'Add the category';
          alert(e.message);
        });
    };
  }

  /** Updates the two derived figures in place, without rebuilding the form. */
  function refreshTotals() {
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
      var box = card.querySelector('input[disabled]');
      if (box) box.value = money(lineTotal(draft[+card.dataset.i]));
    });
    var t = document.querySelector('.total span:last-child');
    if (t) t.textContent = money(draftTotal());
  }

  function placeOrder() {
    var party = ($('oparty').value || '').trim();
    if (!party) { alert('Name the party this order is for.'); return; }

    var lines = draft.filter(function (l) {
      return l.item && Number(l.qty) > 0 && Number(l.rate) > 0;
    });
    if (!lines.length) { alert('A line needs an item, a quantity and a rate.'); return; }

    $('place').disabled = true;
    $('place').textContent = t('Saving…');
