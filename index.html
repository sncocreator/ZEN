    // Same form, same checks, two destinations. The chalan number is the
    // server's to keep: an edit must not renumber the order the plant is
    // already holding.
    var sending = EDITING
      ? api('orderEdit', { token: TOKEN, orderNo: EDITING.orderNo,
                           date: $('odate').value, party: party,
                           notes: ($('onote') ? $('onote').value : ''), lines: lines })
      : api('orderNew', { token: TOKEN, date: $('odate').value, party: party,
                          notes: ($('onote') ? $('onote').value : ''), lines: lines });

    sending
      .then(function (r) {
        if (!EDITING) { showPlaced(r.data); return; }
        var was = EDITING; EDITING = null;
        draft = []; draftParty = ''; draftNote = '';
        showBatch('Order ' + was.orderNo + ' updated.' +
                  (r.data && r.data.wasSent
                    ? '\n' + t('The plant already has the old figures \u2014 send it again.')
                    : ''));
      })
      .catch(function (e) {
        $('place').disabled = false;
        $('place').textContent = EDITING ? t('Save changes') : t('Place order');
        alert(e.message);
      });
  }

  /**
   * The order is saved. It now joins the batch waiting to be sent.
   *
   * Orders are placed one shop at a time — one order, one party, one chalan,
   * because that is what a delivery is. They LEAVE together, as the single list
   * the plant has always been sent, rather than as six separate messages.
   */
  function showPlaced(order) {
    draft = [];
    draftParty = '';
    draftNote = '';
    // A changed rate is said out loud. It has just become the rate offered next
    // time, and that is worth knowing at the moment it happens.
    showBatch('Order ' + order.orderNo + ' saved for ' + order.party + '.' +
              (order.rateChanged ? '\n' + order.rateChanged.text : ''));
  }

  function showBatch(note) {
    mark('showBatch');
    VIEW = 'orders';
    current = null;
    setTab('tabOrders');
    $('search').hidden = true; $('back').hidden = true;
    $('periods').hidden = true; $('range').hidden = true;
    $('title').textContent = 'Orders to send';
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';

    var ticket = takeTicket();
    api('ordersPending', { token: TOKEN }).then(function (r) {
      if (!stillWanted(ticket)) return;
      drawBatch(r.data, note);
    }).catch(fail);
  }

  function drawBatch(orders, note) {
    if (!orders.length) {
      $('main').innerHTML =
        (note ? '<div class="msg">' + esc(note) + '</div>' : '') +
        '<div class="empty">' + t('Nothing waiting to be sent.') + '</div>' +
        '<button class="primary" id="another">' + t('New order') + '</button>';
      $('another').onclick = showOrders;
      return;
    }

    var total = 0;
    var html = (note ? '<div class="msg">' + esc(note) + '</div>' : '');

    html += orders.map(function (o) {
      total += o.total;
      return '<div class="card">' +
        '<label class="tick" style="margin:0"><input type="checkbox" class="pick" ' +
               'data-no="' + esc(o.orderNo) + '" checked> ' +
          '<b>' + esc(o.party) + '</b>&nbsp;<span class="note">' + esc(o.orderNo) + '</span></label>' +
        o.lines.map(function (l) {
          return '<div class="note" style="margin-top:6px">' +
                 esc(l.item) + ' · ' + trimNum(l.qty) + ' × ' + trimNum(l.rate) +
                 (l.packs ? ' (' + trimNum(l.packs) + (l.pack ? ' ' + esc(l.pack) : '') + ')' : '') +
                 (l.gst ? ' + GST' : '') + '</div>';
        }).join('') +
        '<div style="text-align:right;font-weight:600;margin-top:6px">' + money(o.total) + '</div>' +
      '</div>';
    }).join('');

    html +=
      '<div class="total"><span>' + t('Total') + '</span><span id="btotal">' + money(total) + '</span></div>' +
      '<button class="share" id="sendbatch" style="width:100%;margin-top:12px;padding:12px;' +
        'font-size:15px;border-radius:10px">Send on WhatsApp</button>' +
      '<button class="more" id="another">Add another order</button>' +
      '<p class="note" style="margin-top:10px">Untick any that should wait. ' +
      'The entries are already in Jolly, not yet delivered.</p>';

    $('main').innerHTML = html;

    var retotal = function () {
      var sum = 0;
      Array.prototype.forEach.call(document.querySelectorAll('.pick'), function (el, i) {
        if (el.checked) sum += orders[i].total;
      });
      $('btotal').textContent = money(sum);
    };
    Array.prototype.forEach.call(document.querySelectorAll('.pick'), function (el) {
      el.onchange = retotal;
    });

    $('another').onclick = showOrders;
    $('sendbatch').onclick = function () { sendBatch(); };
  }

  function trimNum(n) {
    return String(Math.round((Number(n) || 0) * 1000) / 1000);
  }

  function sendBatch() {
    var nos = [];
    Array.prototype.forEach.call(document.querySelectorAll('.pick'), function (el) {
      if (el.checked) nos.push(el.dataset.no);
    });
    if (!nos.length) { alert('Tick at least one order to send.'); return; }

    $('sendbatch').disabled = true;
    $('sendbatch').textContent = 'Preparing…';

    api('ordersSend', { token: TOKEN, orderNos: nos }).then(function (r) {
      // Opened first, marked sent on the server already — so if WhatsApp is
      // dismissed the orders are not offered again. The message is still on
      // screen to copy if that happens.
      window.open('https://wa.me/?text=' + encodeURIComponent(r.data.message), '_blank');
      showSent(r.data);
    }).catch(function (e) {
      $('sendbatch').disabled = false;
      $('sendbatch').textContent = 'Send on WhatsApp';
      alert(e.message);
    });
  }

  function showSent(sent) {
    $('title').textContent = 'Sent';
    $('main').innerHTML =
      '<div class="msg">' + esc(sent.message) + '</div>' +
      '<button class="share" id="again" style="width:100%;margin-top:12px;padding:12px;' +
        'font-size:15px;border-radius:10px">Open WhatsApp again</button>' +
      '<button class="more" id="another">New order</button>' +
      '<p class="note" style="margin-top:10px">' + sent.count +
      ' order(s) marked sent, ' + money(sent.total) + ' in all. ' +
      'They will not be offered again.</p>';

    $('again').onclick = function () {
      window.open('https://wa.me/?text=' + encodeURIComponent(sent.message), '_blank');
    };
    $('another').onclick = showOrders;
  }

  // --- the ledgers ----------------------------------------------------------

  /**
   * Open the app. `pre` is the boot payload sign-in already brought back; with
   * nothing passed (a token restored from storage) it is fetched in one call.
   *
   * Every request to /exec costs 1.3-2.1 seconds before it does any work, so
   * what this used to cost was not the reading but the WAITING: periods, then
   * parties, one after the other, each paying that toll. Both now arrive
   * together — see getBoot in WebApp.gs.
   */
  function start(pre) {
    $('signin').hidden = true; $('app').hidden = false;
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';
    stillHere();

    // A page cached from before this change, talking to a server that has it,
    // still works; so does the other way round, through the catch below.
    var got = pre
      ? Promise.resolve(pre)
      : api('boot', { token: TOKEN }).then(function (r) { return r.data; })
          .catch(function (e) {
            if (e.expired) throw e;          // a dead token is not a missing action
            return api('periods', { token: TOKEN })
              .then(function (r) { return { periods: r.data, parties: null }; });
          });

    got
      .then(function (b) {
        buildPeriods(b.periods);
        showRights(b.periods);

        // Sent on EVERY load, English included. The list is what fills the App
        // Words tab, and gating it on Gujarati meant the tab did not exist
        // until somebody was already using the language — so the one place to
        // change the wording could not be found until it was too late to need.
        //
        // Not waited for: the app is already readable in its own words, and a
        // slow dictionary should not hold up the ledgers. It is also why it is
        // not part of the boot reply — the phone sends the phrase list, so the
        // server cannot build it, and it costs no waiting as it is.
        loadWords();

        // Asking for the party list when Ledgers is not this login's would be
        // refused by the server — correctly — and the app would open on an
        // error instead of on the screen they do have. getBoot makes the same
        // test and sends no list in that case.
        if (!canSeeAnyLedger()) { firstAllowedScreen(); return null; }
        if (TABS[LIST] === false) LIST = LIST === 'expenses' ? 'ledgers' : 'expenses';
        if (b.parties) return { data: b.parties };
        return api('parties', { token: TOKEN, from: PERIOD.from, to: PERIOD.to });
      })
      .then(function (r) { if (!r) return; parties = r.data; backToList(); })
      .catch(fail);
  }

  function showList(filter) {
    mark('showList(' + (filter || '') + ')');
    // The party list is the Ledgers tab, whatever called this. Typing in the
    // search box reaches here directly, and used to leave another tab underlined
    // over a screenful of ledgers.
    VIEW = LIST;
    setTab(LIST === 'expenses' ? 'tabExpenses' : 'tabLedgers');
    var q = (filter || '').trim().toLowerCase();
    var wantExpense = LIST === 'expenses';

    // Nothing owed, nothing shown — until you go looking for it. A party at nil
    // is off the list, because every party ever opened has a row in Parties and
    // the ones that matter were buried among them. But a settled account is not
    // gone: type any part of the name and it appears, balance and all.
    var shown = parties.filter(function (p) {
      // A row with no kind is a party. An older script answers without the
      // field at all, and then every ledger reads as a party — which is exactly
      // how the app behaved before this screen existed, rather than an empty
      // list nobody can explain.
      if (((p.kind || 'Party') !== 'Party') !== wantExpense) return false;
      if (p.name.toLowerCase().indexOf(q) === -1) return false;
      return q ? true : p.balance !== 0;
    });

    $('main').innerHTML = shown.length === 0
      ? '<div class="empty">' +
        (parties.length
          ? t(wantExpense ? 'No expense head matches that.' : 'No party matches that.')
          : t('No entries yet.')) +
        (!q && parties.length
          ? '<br><span class="note">' +
            t(wantExpense
                ? 'Nothing spent in this period. Search for a head to see it anyway.'
                : 'Nothing outstanding. Search for a name to see a settled account.') +
            '</span>'
          : '') +
        '</div>'
      : shown.map(function (p, i) {
          return '<div class="row" data-i="' + i + '">' +
                   '<div><div class="name">' + esc(p.name) + '</div>' +
                   '<div class="sub">' + p.count + ' ' + t('entries') +
                     (p.last ? ' · ' + t('last') + ' ' + esc(p.last) : '') + '</div></div>' +
                   '<div class="amt ' + cls(p.balance) + '">' + money(p.balance) +
                   ' <span class="tag">' + side(p.balance) + '</span></div>' +
                 '</div>';
        }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (el) {
      el.onclick = function () { WHOLE = false; openLedger(shown[+el.dataset.i].name); };
    });
  }

  /**
   * Which view of a statement is on screen. The default is what is still OPEN
   * (unpaid), newest first; the whole ledger is one tap away (§4h). It is kept
   * here, not read back from the reply, so a correction that reopens the
   * ledger lands in the same view it was made from. Opening a party from the
   * list always starts in the open view.
   */
  var WHOLE = false;

  /** A signed balance (debits positive) as 'Dr' or 'Cr' text and its class. */
  function signedOpen(l) { return l.debit ? 1 : -1; }

  function openLedger(name, showAll) {
    mark('openLedger(' + name + ')');
    current = name;
    VIEW = LIST;
    // A statement belongs to the tab it was opened from — Ledgers for a party,
    // Expenses for a head. Without this the underline could be left over from
    // an earlier visit to Orders, so the tab said one thing and the screen said
    // another, which is indistinguishable from the app having ignored the tap.
    setTab(LIST === 'expenses' ? 'tabExpenses' : 'tabLedgers');
    $('back').textContent = t(backLabel());
    $('main').innerHTML = '<div class="empty">' + t('Loading…') + '</div>';
    $('search').hidden = true; $('back').hidden = false;
    $('periods').hidden = false;
    $('title').textContent = name;

    var ticket = takeTicket();
    api('ledger', { token: TOKEN, party: name, showAll: !!showAll,
                    from: PERIOD.from, to: PERIOD.to, whole: WHOLE }).then(function (r) {
      // Twelve seconds is long enough to have moved on. If you have, this
      // answer is stale and must not repaint the screen you are looking at.
      if (!stillWanted(ticket)) return;
      var d = r.data;
      lastLedger = d;
      var whole = !!d.whole;

      // The oldest thing on the statement, so it is the LAST row now that the
      // lines run newest first. In the open view it is shown only if part of
      // the opening balance is still unmatched, and with that part, not the
      // balance: a running figure over a filtered list would be a wrong number.
      var foot = '';
      if (whole) {
        foot = d.hidden
          ? '<tr><td class="note">—</td>' +
            '<td class="note">' + t('Brought forward') + ' · ' + d.hidden +
              ' ' + t('earlier') + ' ' + t(d.hidden === 1 ? 'entry' : 'entries') +
              '</td><td></td><td></td>' +
            '<td class="' + cls(d.broughtForward) + '">' + money(d.broughtForward) +
            ' ' + side(d.broughtForward) + '</td></tr>'
          : '<tr><td class="note">—</td><td class="note">' +
            t(d.periodOpening ? 'Balance b/f' : 'Opening balance') +
            '</td><td></td><td></td>' +
            '<td class="' + cls(d.opening) + '">' + money(d.opening) +
            ' ' + side(d.opening) + '</td></tr>';
      } else if (!d.periodOpening && d.openingOpen) {
        foot = '<tr><td class="note">—</td><td class="note">' + t('Opening balance') +
          '</td><td></td><td></td>' +
          '<td class="' + cls(d.openingOpen) + '">' + money(d.openingOpen) +
          ' ' + side(d.openingOpen) + '</td></tr>';
      }

      // An Against number that named no bill is a typing mistake somebody must
      // fix. Showing it is the point; hiding it would let a payment quietly
      // clear nothing.
      var unmatched = (d.unmatched && d.unmatched.length)
        ? '<div class="msg" style="color:var(--dr);margin-top:0;margin-bottom:12px">' +
          '<b>' + t('This reference matched no bill') + ':</b> ' +
          d.unmatched.map(esc).join(', ') + '<br>' +
          t('A typing mistake: the payment that names it must be corrected.') + '</div>'
        : '';

      $('main').innerHTML = unmatched +
        '<div class="summary"><div><div class="note">' + t('Balance') + '</div>' +
          '<div class="big ' + cls(d.balance) + '">' + money(d.balance) +
          ' <span class="tag">' + side(d.balance) + '</span></div>' +
          '<div class="note" style="margin-top:6px">' + t('Still open') + ': ' +
            (d.openTotal ? money(d.openTotal) + ' ' + side(d.openTotal) : '0.00') + '</div>' +
          (d.dueTotal
            ? '<div class="note">' + t('Overdue') + ': ' + money(d.dueTotal) + ' ' +
              side(d.dueTotal) + ' (&gt;' + esc(d.creditDays) + 'd)</div>'
            : '') +
          '</div>' +
          '<div style="text-align:right"><div class="note">Debit ' + money(d.totalDebit) + '</div>' +
          '<div class="note">Credit ' + money(d.totalCredit) + '</div>' +
          '<button class="share" id="share">WhatsApp</button>' +
          // Shown only when there is something to show, so its being there
          // means something. It is OUTSIDE the table and never part of a line,
          // which is what keeps it out of the WhatsApp text.
          (d.edits && d.edits.length
            ? '<button class="more" id="editlog" style="margin-top:6px">' +
              t('Edits') + ' (' + d.edits.length + ')</button>'
            : '') +
          '</div></div>' +
        // The three sends. In the page, not a browser prompt.
        '<div class="card" id="sharepick" hidden style="margin-top:0;margin-bottom:12px">' +
          '<button class="more" style="margin-top:0" data-share="whole">' + t('Whole ledger') + '</button>' +
          '<button class="more" style="margin-top:8px" data-share="unpaid">' + t('Unpaid') + '</button>' +
          '<button class="more" style="margin-top:8px" data-share="overdue">' + t('Overdue') + '</button>' +
          '<button class="link" id="sharecancel" style="padding:10px 0 0">' + t('Cancel') + '</button>' +
        '</div>' +
        '<div class="scroll"><table><thead><tr>' +
          '<th>Date</th><th>Particulars</th><th>Debit</th><th>Credit</th><th>' +
          t(whole ? 'Balance' : 'Open') + '</th>' +
        '</tr></thead><tbody>' +
        d.lines.map(function (l, i) {
          // data-i, not the id: the id is what the SERVER is told, and putting
          // it in the page would let a stale screen name a row that has since
          // been corrected. The index is read against the reply on screen.
          return '<tr class="entry" data-i="' + i + '"><td>' + esc(l.date) + '</td>' +
            '<td>' + esc(l.source) + (l.ref ? ' · ' + esc(l.ref) : '') +
            (l.due ? ' <span class="tag">' + t('Overdue') + '</span>' : '') +
            (l.particulars ? '<div class="note">' + esc(l.particulars) + '</div>' : '') + '</td>' +
            '<td>' + (l.debit  ? money(l.debit)  : '') + '</td>' +
            '<td>' + (l.credit ? money(l.credit) : '') + '</td>' +
            (whole
              ? '<td class="' + cls(l.running) + '">' + money(l.running) + ' ' + side(l.running) + '</td></tr>'
              : '<td class="' + cls(signedOpen(l)) + '">' + money(l.open) + ' ' +
                side(signedOpen(l)) + '</td></tr>');
        }).join('') + foot +
        '</tbody></table></div>' +
        (!whole && !d.lines.length && !foot
          ? '<div class="empty">' + t('No open bills.') + '</div>' : '') +
        (whole
          ? (d.hidden ? '<button class="more" id="all">Show all ' + d.total + ' entries</button>'
                      : (d.total ? '<p class="note" style="text-align:center;margin-top:14px">' +
                                   d.total + ' entries in full</p>' : '')) +
            '<button class="more" id="toopen">' + t('Back to unpaid only') + '</button>'
          : '<button class="more" id="towhole">' + t('Show whole ledger') + '</button>' +
            (d.settledCount
              ? '<p class="note" style="text-align:center;margin-top:10px">' + d.settledCount +
                ' ' + t(d.settledCount === 1 ? 'settled entry not shown'
                                             : 'settled entries not shown') + '</p>'
              : ''));

      if ($('all')) $('all').onclick = function () { openLedger(current, true); };
      if ($('towhole')) $('towhole').onclick = function () { WHOLE = true; openLedger(current); };
      if ($('toopen')) $('toopen').onclick = function () { WHOLE = false; openLedger(current); };
      $('share').onclick = function () { $('sharepick').hidden = !$('sharepick').hidden; };
      $('sharecancel').onclick = function () { $('sharepick').hidden = true; };
      Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function (el) {
        el.onclick = function () { shareLedger(el.dataset.share); };
      });
      if ($('editlog')) $('editlog').onclick = showEdits;

      // Tapping a line offers to correct it. An entry with no handle cannot be
      // corrected — it says so rather than opening a form that would fail on
      // saving, which is the same thing said later and less usefully.
      Array.prototype.forEach.call(document.querySelectorAll('tr.entry'), function (el) {
        el.onclick = function () { correctEntry(d.lines[+el.dataset.i]); };
      });
    }).catch(fail);
  }

  // --- correcting a posted entry --------------------------------------------

  /**
   * WHY A CORRECTION IS NOT AN EDIT.
   *
   * The Ledger is append-only and each party's tab in the sheet is a live
   * formula over it, so overwriting a posted figure restates history under
   * somebody who is reading it. The server therefore cancels the old entry and
   * appends the corrected one. All this screen does is collect the change and
   * the reason for it.
   *
   * The reason is required. Six months on, a figure that moved says nothing
   * about whether the bill was misread or the customer renegotiated, and the
   * before-and-after cannot tell you which.
   */
  function correctEntry(line) {
    if (!line) return;
    if (!line.id) {
      alert(t('This entry cannot be corrected yet. Open the ledger again and try once more.'));
      return;
    }
    mark('correctEntry');

    var isDebit = !!line.debit;
    $('main').innerHTML =
      '<div class="card">' +
        '<h2>' + t('Correct this entry') + '</h2>' +
        '<p class="note">' + esc(line.date) + ' \u00b7 ' + esc(line.source) +
          (line.ref ? ' \u00b7 ' + esc(line.ref) : '') + '</p>' +
        '<div class="field"><label>' + t('Date') + '</label>' +
          '<input type="date" id="edate" value="' + esc(isoOf(line.date)) + '"></div>' +
        '<div class="field"><label>' + t('Ledger') + '</label>' +
          '<input id="eparty" list="partynames" value="' + esc(current) + '"></div>' +
        '<datalist id="partynames">' +
          parties.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') +
        '</datalist>' +
        '<div class="field"><label>' + t('Sr/Ref') + '</label>' +
          '<input id="eref" value="' + esc(line.ref || '') + '"></div>' +
        '<div class="field"><label>' + t('Particulars') + '</label>' +
          '<input id="eparticulars" value="' + esc(line.particulars || '') + '"></div>' +
        '<div class="field"><label>' + t('Amount') + '</label>' +
          '<input type="number" inputmode="decimal" step="0.01" id="eamount" value="' +
          (isDebit ? line.debit : line.credit) + '"></div>' +
        '<div class="field"><label>Dr / Cr</label>' +
          '<select id="eside">' +
            '<option value="Dr"' + (isDebit ? ' selected' : '') + '>Dr</option>' +
            '<option value="Cr"' + (isDebit ? '' : ' selected') + '>Cr</option>' +
          '</select></div>' +
        '<div class="field"><label>' + t('Why is it being changed?') + '</label>' +
          '<input id="enote" placeholder="' + t('e.g. bill was read wrong') + '"></div>' +
        '<button class="primary" id="esave">' + t('Save the correction') + '</button>' +
        '<button class="more" id="edrop">' + t('Remove this entry') + '</button>' +
        '<button class="more" id="ecancel">' + t('Cancel') + '</button>' +
      '</div>';

    $('ecancel').onclick = function () { openLedger(current, true); };
    $('esave').onclick = function () { saveCorrection(line, false); };
    $('edrop').onclick = function () { saveCorrection(line, true); };
  }

  /** 'dd MMM yyyy' back into what a date input wants. */
  function isoOf(printed) {
    var d = new Date(printed);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }

  function saveCorrection(line, removing) {
    var note = $('enote').value.trim();
    if (!note) { alert(t('Say briefly why it is being changed.')); $('enote').focus(); return; }
    if (removing && !confirm(t('Remove this entry? The ledger will show that it was removed.'))) return;

    $('esave').disabled = true;
    if ($('edrop')) $('edrop').disabled = true;

    var body = removing
      ? { token: TOKEN, id: line.id, note: note }
      : { token: TOKEN, id: line.id, note: note,
          date: $('edate').value,
          party: $('eparty').value.trim(),
          ref: $('eref').value.trim(),
          particulars: $('eparticulars').value.trim(),
          amount: $('eamount').value,
          side: $('eside').value };

    api(removing ? 'entryDelete' : 'entryEdit', body)
      .then(function () {
        // Reopened rather than patched on screen: the running balances, the
        // totals and the brought-forward figure all move, and recomputing them
        // here would be a second implementation of the arithmetic that could
        // disagree with the sheet's.
        openLedger(current, true);
      })
      .catch(function (e) {
        $('esave').disabled = false;
        if ($('edrop')) $('edrop').disabled = false;
        alert(e.message);
      });
  }

  /**
   * What has been corrected on this ledger, and by whom.
   *
   * IT IS NEVER PART OF THE STATEMENT. The WhatsApp text is built from
   * d.lines, and nothing here touches those — so a customer sent a statement
   * receives the corrected figures and no account of how they got that way,
   * which is what the person sending it would say out loud anyway.
   */
  function showEdits() {
    mark('showEdits');
    var d = lastLedger;
    if (!d) { openLedger(current, true); return; }

    var rows = (d.edits || []).map(function (e) {
      var what = e.removed
        ? '<div class="note">' + t('Entry removed') + '</div>' +
          '<div>' + faceText(e.was) + '</div>'
        : e.changed.map(function (f) {
            return '<div>' + t(fieldName(f)) + ': <span class="was">' +
                   esc(fieldOf(e.was, f)) + '</span> \u2192 <b>' +
                   esc(fieldOf(e.now, f)) + '</b></div>';
          }).join('');

      return '<div class="pl" style="padding:10px 14px">' +
               '<div class="note">' + esc(e.at) +
                 (e.by ? ' \u00b7 ' + esc(e.by) : '') + '</div>' +
               what +
               (e.note ? '<div class="note" style="margin-top:6px">\u201c' +
                         esc(e.note) + '\u201d</div>' : '') +
             '</div>';
    }).join('');

    $('main').innerHTML =
      '<p class="note">' + t('These are kept in the app. They are not part of the statement you send.') +
      '</p>' + (rows || '<div class="empty">' + t('No edits.') + '</div>') +
      '<button class="more" id="backfromedits">' + t('Back to the ledger') + '</button>';

    $('backfromedits').onclick = function () { openLedger(current, true); };
  }

  function fieldName(f) {
    return { date: 'Date', party: 'Ledger', ref: 'Sr/Ref',
             particulars: 'Particulars', amount: 'Amount' }[f] || f;
  }

  function fieldOf(face, f) {
    if (!face) return '';
    if (f === 'amount') {
      return money(face.debit || face.credit) + ' ' + (face.debit ? 'Dr' : 'Cr');
    }
    return face[f] == null ? '' : String(face[f]);
  }

  function faceText(face) {
    if (!face) return '';
    return esc(face.date) + ' \u00b7 ' + esc(face.particulars || face.ref || '') +
           ' \u00b7 ' + money(face.debit || face.credit) +
           ' ' + (face.debit ? 'Dr' : 'Cr');
  }

  // --- sending a ledger -----------------------------------------------------

  /**
   * THREE SENDS, all built from `lines` alone — never from `edits` (§4b).
   *
   *   whole    every entry, newest first: closing balance at the top, the
   *            opening or brought-forward at the foot
   *   unpaid   only lines with something still open, each showing its open
   *            amount, closing with the total still open
   *   overdue  the same, restricted to the overdue lines, headed with the
   *            credit days so the customer can see the basis
   *
   * Each sends what is on screen when the screen already holds the lines it
   * needs, and asks the server for the right view first when it does not.
   * Nothing is recalculated here except adding up lines already on the page.
   */

  var SHARE_NOTE = '_Most recent entries only — ask for the full ledger if you need it._';

  /**
   * Fit a message into a link. Whole entries are dropped from the OLD end until
   * it fits — newest first means the oldest are last, and the figures anyone is
   * asking for are at the top or in `foot` — and the message says on its face
   * that it was cut. A foot that is itself the oldest thing (the opening) is
   * dropped with them, since it would otherwise sit under a gap.
   */
  function fitText(head, blocks, foot, footIsOldest) {
    var n = blocks.length;
    for (;;) {
      var cut = n < blocks.length;
      var parts = head.slice();
      if (cut) parts.push(SHARE_NOTE);
      parts.push('');
      blocks.slice(0, n).forEach(function (b) { parts.push(b, ''); });
      if (!(cut && footIsOldest)) foot.forEach(function (f) { parts.push(f); });
      var text = parts.join('\n').replace(/\n+$/, '');
      if (text.length <= 1800 || n === 0) return text;
      n--;
    }
  }

  /** The whole ledger: today's text, in the new order. */
  function wholeText(d, name) {
    var head = ['*' + name + '*', PERIOD.label,
                '*Closing: ' + money(d.balance) + ' ' + side(d.balance) + '*',
                'Debit ' + money(d.totalDebit) + '  ·  Credit ' + money(d.totalCredit)];

    var blocks = d.lines.map(function (l) {
      var b = [l.date + '  ' + l.source + (l.ref ? '  ' + l.ref : '')];
      if (l.particulars) b.push(l.particulars);
      b.push((l.debit ? 'Dr ' + money(l.debit) : 'Cr ' + money(l.credit)) +
             '   bal ' + money(l.running) + ' ' + side(l.running));
      return b.join('\n');
    });

    var foot = [d.hidden
      ? 'Brought forward (' + d.hidden + ' earlier ' +
        (d.hidden === 1 ? 'entry' : 'entries') + '): ' +
        money(d.broughtForward) + ' ' + side(d.broughtForward)
      : (d.periodOpening ? 'Balance b/f: ' : 'Opening: ') +
        money(d.opening) + ' ' + side(d.opening)];

    return fitText(head, blocks, foot, true);
  }

  /** What is still unpaid, or just what is overdue. */
  function unpaidText(d, name, overdue) {
    var rows = d.lines.filter(function (l) { return l.open > 0 && (!overdue || l.due); });
    var sum = 0;
    rows.forEach(function (l) { sum += signedOpen(l) * l.open; });

    // The total is the server's. Whatever it holds that the lines do not is the
    // opening balance's unmatched part, which is then shown as the oldest line.
    var total = overdue ? d.dueTotal : d.openTotal;
    var openingPart = Math.round((total - sum) * 100) / 100;

    var head = ['*' + name + '*', PERIOD.label,
                overdue ? '*Overdue: more than ' + d.creditDays + ' days*' : '*Unpaid*'];

    var blocks = rows.map(function (l) {
      var b = [l.date + '  ' + l.source + (l.ref ? '  ' + l.ref : '')];
      if (l.particulars) b.push(l.particulars);
      b.push((l.debit ? 'Dr ' + money(l.debit) : 'Cr ' + money(l.credit)) +
             '   open ' + money(l.open) + ' ' + (l.debit ? 'Dr' : 'Cr'));
      return b.join('\n');
    });
    if (!d.periodOpening && Math.abs(openingPart) >= 0.005) {
      blocks.push('Opening balance\nopen ' + money(openingPart) + ' ' + side(openingPart));
    }

    var foot = ['*Total ' + (overdue ? 'overdue' : 'still open') + ': ' +
                money(total) + ' ' + side(total) + '*'];
    return fitText(head, blocks, foot, false);
  }

  function shareLedger(kind) {
    var d = lastLedger, name = current;
    if (!d) return;

    // Does what is on screen hold every line this choice needs? The whole view is
    // trimmed to the newest few unless "show all" was tapped, so only an untrimmed
    // whole view has every entry. The open view has every open line, and nothing else.
    var haveAll = d.whole && !d.hidden;
    var enough = kind === 'whole' ? haveAll : (!d.whole || haveAll);

    var open = function (data) {
      var text = kind === 'whole' ? wholeText(data, name) : unpaidText(data, name, kind === 'overdue');
      // No number in the link, so WhatsApp asks who to send it to. Works the same
      // on a phone and on WhatsApp Web.
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      if ($('sharepick')) $('sharepick').hidden = true;
    };

    if (enough) { open(d); return; }

    var buttons = document.querySelectorAll('[data-share]');
    var setBusy = function (b) {
      Array.prototype.forEach.call(buttons, function (el) { el.disabled = b; });
    };
    setBusy(true);
    api('ledger', { token: TOKEN, party: name, showAll: kind === 'whole',
                    from: PERIOD.from, to: PERIOD.to, whole: kind === 'whole' })
      .then(function (r) {
        setBusy(false);
        if (current !== name) return;       // moved on while it was coming
        open(r.data);
      })
      .catch(function (e) { setBusy(false); alert(e.message); });
  }

  function backToList() {
    mark('backToList');
    current = null;
    $('search').hidden = false; $('back').hidden = true;
    $('title').textContent = t(listTitle());
    showList($('search').value);
  }

  $('go').onclick = signIn;
  $('p').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
  $('u').onkeydown = function (e) { if (e.key === 'Enter') $('p').focus(); };
  $('back').onclick = backToList;
  $('out').onclick = signOut;
  $('build').onclick = showTrail;
  $('tabLedgers').onclick = showLedgers;
  $('tabExpenses').onclick = showExpenses;
  $('tabOrders').onclick = showOrders;
  $('tabMoney').onclick = showMoney;
  $('tabRecent').onclick = showRecent;
  $('tabPL').onclick = showProfitLoss;
  $('search').oninput = function () { showList(this.value); };

  localizeStatic();

  // Wake the server while the password is being typed (owner, 30 Oct 2026).
  // Apps Script lets an idle instance go, and the first call afterwards takes
  // about three seconds against the usual 1.3-2.1 — so sign-in was paying for
  // the cold start as well as its own work. This is a GET of `ping`, which
  // reads nothing, writes nothing, needs no token and returns no data; it is
  // sent for its timing alone and its reply is thrown away. A failure here
  // means nothing: it is not on the path to anything.
  if (!TOKEN) { try { fetch(API + '?action=ping').catch(function () {}); } catch (e) {} }

  if (TOKEN) start();
</script>
</body>
</html>
