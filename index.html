<!--
  The whole phone app. Four screens: sign in, the party list, one ledger,
  and Profit.

  The token lives in the phone's own storage so you stay signed in, and is sent
  with every request. It is not a convenience — the server refuses any data
  request without a valid one, so the login cannot be skipped.
-->
<style>
  :root {
    --bg: #f6f7f9;  --card: #ffffff;  --ink: #16181d;  --muted: #6b7280;
    --line: #e5e7eb; --dr: #b3261e;   --cr: #12603c;   --accent: #1a56db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #191c22; --ink: #e8eaed; --muted: #9aa1ad;
      --line: #2a2e37; --dr: #ff8a80; --cr: #6ddba0;  --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 10px; font-size: 19px; letter-spacing: -0.01em; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  button.link { background: none; border: 0; color: var(--accent); font-size: 15px;
                padding: 0 0 8px; cursor: pointer; }
  input { width: 100%; padding: 12px 13px; font-size: 16px; color: var(--ink);
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  main { padding: 10px 12px 32px; }

  /* sign in */
  .signin { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }
  .signin h2 { margin: 0 0 4px; font-size: 22px; }
  .signin p.note { margin: 0 0 22px; }
  .signin input { margin-bottom: 10px; }
  .signin button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px;
  }
  .signin button[disabled] { opacity: .6; }
  .error { color: var(--dr); margin: 12px 0 0; font-size: 14px; }

  /* lists */
  .row {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .row:active { opacity: .6; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .dr { color: var(--dr); } .cr { color: var(--cr); }
  .tag { font-size: 11px; color: var(--muted); font-weight: 500; }
  .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between;
  }
  .summary .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 6px; text-align: right; font-variant-numeric: tabular-nums;
           border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px;
       text-transform: uppercase; letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .note { color: var(--muted); font-size: 12px; }
  .more {
    display: block; width: 100%; margin-top: 14px; padding: 12px;
    font-size: 15px; color: var(--accent); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }

  /* period picker */
  .chips {
    display: flex; gap: 6px; margin-top: 10px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 12px; font-size: 13px; cursor: pointer;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; white-space: nowrap;
  }
  .chip.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .range { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .range input { padding: 8px 10px; font-size: 14px; }

  /* ledgers / p&l switch */
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 9px; font-size: 14px; cursor: pointer;
    color: var(--muted); background: none; border: 0;
    border-bottom: 2px solid var(--line);
  }
  .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

  /* p&l */
  .pl { background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 4px 14px 10px; margin-bottom: 12px; }
  .pl .l { display: flex; justify-content: space-between; padding: 9px 0;
           border-bottom: 1px solid var(--line); }
  .pl .l:last-child { border-bottom: 0; }
  .pl .head { font-weight: 600; font-size: 12px; text-transform: uppercase;
              letter-spacing: .04em; color: var(--muted); padding-top: 14px; }
  .pl .v { font-variant-numeric: tabular-nums; }
  .pl .tot { font-weight: 600; }
  .pl .net { font-size: 19px; font-weight: 700; }
  .pl .sub { padding-left: 12px; }
</style>

<div id="signin" class="signin">
  <h2>Ledgers</h2>
  <p class="note">Sign in to continue.</p>
  <input id="u" type="text" placeholder="Username" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <p class="error" id="err" hidden></p>
</div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <button class="link" id="back" hidden>‹ All parties</button>
      <span></span>
      <button class="link" id="out">Sign out</button>
    </div>
    <h1 id="title">Ledgers</h1>
    <div class="tabs">
      <button class="tab on" id="tabLedgers">Ledgers</button>
      <button class="tab" id="tabPL">Profit</button>
    </div>
    <input type="search" id="search" placeholder="Search a party" autocomplete="off">
    <div class="chips" id="periods"></div>
    <div class="range" id="range" hidden>
      <input type="date" id="from"><span class="note">to</span><input type="date" id="to">
      <button class="link" id="apply">Apply</button>
    </div>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
  var TOKEN = null, parties = [], current = null, VIEW = 'ledgers';
  var PERIOD = { from: '', to: '', label: '' };   // empty means everything
  var FY = null;
  var $ = function (id) { return document.getElementById(id); };

  // The phone remembers the token so you are not asked to sign in every time.
  try { TOKEN = localStorage.getItem('ledger_token'); } catch (e) {}

  function money(n) {
    return Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function side(n) { return n >= 0 ? 'Dr' : 'Cr'; }   // + party owes us, - we owe them
  function cls(n)  { return n >= 0 ? 'dr' : 'cr'; }
  function esc(s)  { return String(s == null ? '' : s).replace(/[&<>"]/g,
                      function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  // --- sign in --------------------------------------------------------------

  function signIn() {
    $('go').disabled = true; $('go').textContent = 'Signing in…'; $('err').hidden = true;

    google.script.run.withSuccessHandler(function (r) {
      $('go').disabled = false; $('go').textContent = 'Sign in';
      if (!r.ok) { $('err').textContent = r.error; $('err').hidden = false; return; }
      TOKEN = r.token;
      try { localStorage.setItem('ledger_token', TOKEN); } catch (e) {}
      $('p').value = '';
      start();
    }).withFailureHandler(function (e) {
      $('go').disabled = false; $('go').textContent = 'Sign in';
      $('err').textContent = e.message; $('err').hidden = false;
    }).login($('u').value, $('p').value);
  }

  function signOut() {
    google.script.run.logout(TOKEN);
    TOKEN = null;
    try { localStorage.removeItem('ledger_token'); } catch (e) {}
    $('app').hidden = true; $('signin').hidden = false;
  }

  /** Any expired or missing token lands here, from any screen. */
  function fail(e) {
    if (/sign in again/i.test(e.message)) {
      TOKEN = null;
      try { localStorage.removeItem('ledger_token'); } catch (e2) {}
      $('app').hidden = true; $('signin').hidden = false;
      $('err').textContent = e.message; $('err').hidden = false;
      return;
    }
    $('main').innerHTML = '<div class="empty">Could not load.<br>' +
      '<span class="note">' + esc(e.message) + '</span></div>';
  }

  // --- the period on screen -------------------------------------------------

  /** Builds the chips: the whole year, each of its months, then a custom range. */
  function buildPeriods(fy) {
    FY = fy;
    PERIOD = { from: fy.from, to: fy.to, label: fy.label };

    var html = '<button class="chip on" data-k="fy">' + esc(fy.label) + '</button>';
    fy.months.forEach(function (m, i) {
      html += '<button class="chip" data-k="m' + i + '">' + esc(m.label) + '</button>';
    });
    html += '<button class="chip" data-k="range">Dates…</button>';
    $('periods').innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (el) {
      el.onclick = function () {
        Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
          c.classList.remove('on');
        });
        el.classList.add('on');
        var k = el.dataset.k;

        if (k === 'range') {
          $('range').hidden = false;
          if (!$('from').value) { $('from').value = FY.from; $('to').value = FY.to; }
          return;
        }
        $('range').hidden = true;

        if (k === 'fy') PERIOD = { from: FY.from, to: FY.to, label: FY.label };
        else {
          var m = FY.months[Number(k.slice(1))];
          PERIOD = { from: m.from, to: m.to, label: m.label + ' ' + m.year };
        }
        reload();
      };
    });

    $('apply').onclick = function () {
      if (!$('from').value || !$('to').value) return;
      PERIOD = { from: $('from').value, to: $('to').value,
                 label: $('from').value + ' to ' + $('to').value };
      reload();
    };
  }

  /** Re-asks for whatever screen is showing, under the current period. */
  function reload() {
    if (VIEW === 'pl') { showProfitLoss(); return; }
    if (current) { openLedger(current); return; }
    $('main').innerHTML = '<div class="empty">Loading…</div>';
    google.script.run.withSuccessHandler(function (p) {
      parties = p; showList($('search').value);
    }).withFailureHandler(fail).getParties(TOKEN, PERIOD.from, PERIOD.to);
  }

  // --- profit & loss --------------------------------------------------------

  function showProfitLoss() {
    VIEW = 'pl';
    current = null;
    $('tabPL').classList.add('on'); $('tabLedgers').classList.remove('on');
    $('search').hidden = true; $('back').hidden = true;
    $('title').textContent = 'Profit';
    $('main').innerHTML = '<div class="empty">Loading…</div>';

    google.script.run.withSuccessHandler(function (d) {
      var html = '<div class="pl">' +
        '<div class="l head"><span>Income</span><span></span></div>' +
        line('Sales', d.sales) +
        '<div class="l head"><span>Costs</span><span></span></div>' +
        line('Purchases', d.purchases);

      d.expenses.forEach(function (e) {
        html += line(e.name, e.amount, 'sub');
      });
      if (!d.expenses.length) {
        html += '<div class="l sub"><span class="note">No expenses in this period</span><span></span></div>';
      }

      html += line('Total costs', d.totalCost, 'tot') + '</div>';

      html += '<div class="pl"><div class="l">' +
        '<span class="net">Net</span>' +
        '<span class="net v ' + (d.net >= 0 ? 'cr' : 'dr') + '">' +
        (d.net < 0 ? '(' + money(d.net) + ')' : money(d.net)) + '</span></div>' +
        '<div class="l"><span class="note">' + esc(PERIOD.label) + '</span>' +
        '<span class="note">' + (d.net >= 0 ? 'profit' : 'loss') + '</span></div></div>';

      $('main').innerHTML = html;
    }).withFailureHandler(fail).getProfitLoss(TOKEN, PERIOD.from, PERIOD.to);
  }

  function line(label, value, cls2) {
    return '<div class="l ' + (cls2 || '') + '"><span>' + esc(label) + '</span>' +
           '<span class="v ' + (cls2 === 'tot' ? 'tot' : '') + '">' + money(value) + '</span></div>';
  }

  function showLedgers() {
    VIEW = 'ledgers';
    current = null;
    $('tabLedgers').classList.add('on'); $('tabPL').classList.remove('on');
    $('search').hidden = false; $('back').hidden = true;
    $('title').textContent = 'Ledgers';
    reload();
  }

  // --- the ledgers ----------------------------------------------------------

  function start() {
    $('signin').hidden = true; $('app').hidden = false;
    $('main').innerHTML = '<div class="empty">Loading…</div>';
    google.script.run.withSuccessHandler(function (fy) {
      buildPeriods(fy);
      google.script.run.withSuccessHandler(function (p) {
        parties = p; backToList();
      }).withFailureHandler(fail).getParties(TOKEN, PERIOD.from, PERIOD.to);
    }).withFailureHandler(fail).getPeriods(TOKEN);
  }

  function showList(filter) {
    var q = (filter || '').trim().toLowerCase();
    var shown = parties.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; });

    $('main').innerHTML = shown.length === 0
      ? '<div class="empty">' + (parties.length ? 'No party matches that.' : 'No entries yet.') + '</div>'
      : shown.map(function (p, i) {
          return '<div class="row" data-i="' + i + '">' +
                   '<div><div class="name">' + esc(p.name) + '</div>' +
                   '<div class="sub">' + p.count + ' entries' +
                     (p.last ? ' · last ' + esc(p.last) : '') + '</div></div>' +
                   '<div class="amt ' + cls(p.balance) + '">' + money(p.balance) +
                   ' <span class="tag">' + side(p.balance) + '</span></div>' +
                 '</div>';
        }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (el) {
      el.onclick = function () { openLedger(shown[+el.dataset.i].name); };
    });
  }

  function openLedger(name, showAll) {
    current = name;
    $('main').innerHTML = '<div class="empty">Loading…</div>';
    $('search').hidden = true; $('back').hidden = false;
    $('title').textContent = name;

    google.script.run.withSuccessHandler(function (d) {
      // The first row is either the opening balance, or — when older entries
      // are not on screen — the balance brought forward to this point.
      var first = d.hidden
        ? '<tr><td class="note">—</td>' +
          '<td class="note">Brought forward · ' + d.hidden + ' earlier ' +
            (d.hidden === 1 ? 'entry' : 'entries') + '</td><td></td><td></td>' +
          '<td class="' + cls(d.broughtForward) + '">' + money(d.broughtForward) +
          ' ' + side(d.broughtForward) + '</td></tr>'
        : '<tr><td class="note">—</td><td class="note">' +
          (d.periodOpening ? 'Balance b/f' : 'Opening balance') +
          '</td><td></td><td></td>' +
          '<td class="' + cls(d.opening) + '">' + money(d.opening) +
          ' ' + side(d.opening) + '</td></tr>';

      $('main').innerHTML =
        '<div class="summary"><div><div class="note">Balance</div>' +
          '<div class="big ' + cls(d.balance) + '">' + money(d.balance) +
          ' <span class="tag">' + side(d.balance) + '</span></div></div>' +
          '<div style="text-align:right"><div class="note">Debit ' + money(d.totalDebit) + '</div>' +
          '<div class="note">Credit ' + money(d.totalCredit) + '</div></div></div>' +
        '<div class="scroll"><table><thead><tr>' +
          '<th>Date</th><th>Particulars</th><th>Debit</th><th>Credit</th><th>Balance</th>' +
        '</tr></thead><tbody>' + first +
        d.lines.map(function (l) {
          return '<tr><td>' + esc(l.date) + '</td>' +
            '<td>' + esc(l.source) + (l.ref ? ' · ' + esc(l.ref) : '') +
            (l.particulars ? '<div class="note">' + esc(l.particulars) + '</div>' : '') + '</td>' +
            '<td>' + (l.debit  ? money(l.debit)  : '') + '</td>' +
            '<td>' + (l.credit ? money(l.credit) : '') + '</td>' +
            '<td class="' + cls(l.running) + '">' + money(l.running) + ' ' + side(l.running) + '</td></tr>';
        }).join('') +
        '</tbody></table></div>' +
        (d.hidden
          ? '<button class="more" id="all">Show all ' + d.total + ' entries</button>'
          : (d.total ? '<p class="note" style="text-align:center;margin-top:14px">' +
                       d.total + ' entries in full</p>' : ''));

      if ($('all')) $('all').onclick = function () { openLedger(current, true); };
    }).withFailureHandler(fail).getLedger(TOKEN, name, !!showAll, PERIOD.from, PERIOD.to);
  }

  function backToList() {
    current = null;
    $('search').hidden = false; $('back').hidden = true;
    $('title').textContent = 'Ledgers';
    showList($('search').value);
  }

  $('go').onclick = signIn;
  $('p').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
  $('u').onkeydown = function (e) { if (e.key === 'Enter') $('p').focus(); };
  $('back').onclick = backToList;
  $('out').onclick = signOut;
  $('tabLedgers').onclick = showLedgers;
  $('tabPL').onclick = showProfitLoss;
  $('search').oninput = function () { showList(this.value); };

  if (TOKEN) start();
</script>
